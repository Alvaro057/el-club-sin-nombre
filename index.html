  '¡Pásasela a alguien que lleve algo negro!', '¡Todos de pie!', '¡Pásala con los ojos cerrados!', '¡Quien la tenga, que diga su nombre en voz alta!', '¡Pásasela a alguien que no la haya tocado todavía!',
  '¡Cambio de sentido otra vez!', '¡Con las dos manos!', '¡Quien la tenga, que haga una reverencia!'];
const PATATA_OBJ = ['un cojín', 'una servilleta hecha bola', 'un vaso de plástico vacío', 'una naranja', 'un peluche', 'un rollo de papel'];

// =====================================================================
// MINIJUEGOS · revisión para la fiesta
// - Las preguntas no se repiten en toda la noche (S.used) y puntúan por rapidez, como en Kahoot.
// - Se quitan los que no encajan y se rehacen varios para que se jueguen hablando y mirando la tele.
// =====================================================================
// coge n elementos que todavía no han salido esta noche
function fresh(S, key, arr, n, id = x => JSON.stringify(x)){ S.used ||= {}; const u = new Set(S.used[key] || []);
  let pool = shuffle(arr.filter(x => !u.has(id(x)))); if (pool.length < n){ u.clear(); pool = shuffle(arr); }
  const out = pool.slice(0, n); S.used[key] = [...u, ...out.map(id)]; return out; }
const speedPts = (ms, max, base = 100, bonus = 100) => base + Math.round(bonus * Math.max(0, 1 - ms / max));

// ---------- fuera de la noche ----------
// (no se borran del todo: El Caos Final reutiliza piezas de Reflejos)
['duelo', 'banderas', 'calculo', 'atrapa', 'toques', 'ultimo', 'reflejos', 'juicio', 'rasca', 'diez'].forEach(k => { if (GAMES[k]){ GAMES[k].hidden = true; GAMES[k].removed = true; } });
const metaOf = g => ({name: g.name, cat: g.cat, icon: g.icon, desc: g.desc, rules: g.rules, ri: g.ri, ctl: g.ctl, min: g.min});

// ---------- preguntas que no se repiten y puntúan por rapidez ----------
GAMES.trivial.init = function(S){ const g = {}; rInit(g, fresh(S, 'trivia', TRIVIA.concat(TRIVIA2), 6, t => t[0]).map(t => { const o = shuffle(t.slice(1)); return {q: t[0], o, c: o.indexOf(t[1])}; }), 12000, 3800); return g; };
GAMES.mayoria.init = function(S){ const g = {}; rInit(g, fresh(S, 'mayoria', MAJORITY, 4, m => m[0]).map(m => ({q: m[0], o: m.slice(1)})), 12000, 4800); return g; };
GAMES.quien.init = function(S){ const g = {}; rInit(g, fresh(S, 'who', WHO, 3).map(q => ({q})), 15000, 5500); return g; };
GAMES.precio.init = function(S){ const g = {}; rInit(g, fresh(S, 'precio', ESTIMATES, 4, e => e[0]).map(e => ({q: e[0], val: e[1], u: e[2]})), 20000, 6500); return g; };
GAMES.caras.init = function(S){ const g = {}; rInit(g, fresh(S, 'caras', FACES, 3).map(q => ({q})), 0, 6000); return g; };
// La Ruleta del Mentiroso, con afirmaciones que tienen trampa y más rondas
GAMES.mentiroso.init = function(S){ const g = {}; rInit(g, fresh(S, 'verdades', TRUTHS_HARD, 5, t => t[0]).map(t => ({q: t[0], v: t[1]})), 13000, 4800); return g; };
GAMES.mentiroso.result = function(S, g){ return {raw: sumRaw(S, g, (x, i) => x.v === g.rounds[i].v ? speedPts(x.ms, g.qms) : 0)}; };
// Termina el refrán: de fácil a difícil, y entre 5 y 7 rondas
quizGame('refran', metaOf(GAMES.refran), {qms: 10000, rounds: S => { const n = 5 + rnd(3); const by = d => REFRANES2.filter(r => r[2] === d);
  const pickD = [1, 1, 2, 2, 3, 3, 3].slice(0, n); const used = new Set(); return pickD.map(d => { const [r] = fresh(S, 'refran' + d, by(d), 1, x => x[0]); used.add(r[0]); return Object.assign({q: r[0]}, mkOpts(r[1], by(d).map(x => x[1]))); }); }});
GAMES.refran.desc = 'Medio refrán en la tele. ¿Cómo acaba? Empiezan fáciles y acaban de abuelo sabio.';
// Cine en emojis: más películas, de fácil a difícil, con 2 a 6 emojis
quizGame('emoji', metaOf(GAMES.emoji), {qms: 13000, rounds: S => { const n = 5 + rnd(2); const by = d => EMOJI2.filter(e => e[2] === d);
  return [1, 1, 2, 2, 3, 3].slice(0, n).map(d => { const [e] = fresh(S, 'emoji' + d, by(d), 1, x => x[1]); return Object.assign({q: d === 3 ? '¿Qué película o serie es? (difícil)' : '¿Qué película es?', qh: `<div class="emo">${e[0]}</div>`}, mkOpts(e[1], EMOJI2.map(x => x[1]))); }); }});
// Colores Tramposos: cuenta sobre todo la rapidez
GAMES.colores.result = function(S, g){ return {raw: sumRaw(S, g, (x, i) => x.i === g.rounds[i].c ? speedPts(x.ms, g.qms, 40, 160) : 0)}; };
GAMES.colores.desc = 'La palabra dice un color y está pintada de otro. Acierta el color de la tinta… y sé el más rápido.';
// ¿Más o Menos? sin repetir
GAMES.masalto.init = function(S){ const g = {}; rInit(g, fresh(S, 'compare', COMPARE, 6, x => x[0]).map(([q, a, b, c]) => ({q, o: [a, b], c})), 8000, 3200); return g; };

// ---------- Memoria de Élite: hasta que solo quede uno ----------
def('memoria', {name: 'Memoria de Élite', cat: 'Memoria', icon: '🧠', desc: 'La tele enciende colores y cada ronda añade uno más, cada vez más rápido. Quien falla, fuera. Hasta que quede uno.', min: 2,
  rules: ['Mira la tele: se encenderán colores en orden.', 'Repítelos en tu móvil. Cada ronda la secuencia crece y va más rápido.', 'Si fallas, quedas eliminado. Gana el último que siga dentro.'], ri: ['👀', '🟥🟦', '🧠'], ctl: 'Cuatro botones de colores',
  init(S){ return {seq: [rnd(4), rnd(4)], alive: pidsAll(S).slice(), out: [], r: 0, st: 'wait', ans: {}}; },
  start(S, g, v){ this.show(g, v); },
  sp(g){ return Math.max(320, 760 - g.r * 45); },
  show(g, v){ g.seq.push(rnd(4)); g.ans = {}; g.st = 'show'; g.t0 = v; g.t1 = v + 700 + g.seq.length * this.sp(g) + 300; },
  step(S, g, v){
    if (g.st === 'show' && v >= g.t1){ g.st = 'q'; g.t0 = v; g.t1 = v + 3500 + g.seq.length * 750; return false; }
    if (g.st === 'q'){ const live = g.alive.filter(p => pidsOn(S).includes(p) || S.players[p].bot); if (v >= g.t1 || (live.length && live.every(p => g.ans[p] != null))){
        const fail = g.alive.filter(p => !(g.ans[p] && g.ans[p].ok)); const keep = g.alive.filter(p => g.ans[p] && g.ans[p].ok);
        g.lastOut = fail; if (keep.length) { g.out.push({r: g.r, ps: fail}); g.alive = keep; } else g.out.push({r: g.r, ps: []});
        g.st = 'rev'; g.t0 = v; g.t1 = v + 3200; } return false; }
    if (g.st === 'rev' && v >= g.t1){ if (g.alive.length <= 1 || g.r >= 40) return true; g.r++; this.show(g, v); }
    return false; },
  act(S, g, pid, a, v){ if (a.a !== 'seq' || g.st !== 'q' || +a.r !== g.r || g.ans[pid] != null || !g.alive.includes(pid) || !Array.isArray(a.s)) return false; g.ans[pid] = {ok: a.s.length === g.seq.length && a.s.every((x, i) => +x === g.seq[i]), ms: v - g.t0}; },
  result(S, g){ const raw = {}; pidsAll(S).forEach(p => raw[p] = 0); g.out.forEach(o => o.ps.forEach(p => raw[p] = o.r * 100)); g.alive.forEach(p => raw[p] = (g.r + 2) * 100); return {raw}; },
  pub(S, g){ return {r: g.r, n: 1, st: g.st, t0: g.t0, t1: g.t1, len: g.seq.length, sp: this.sp(g), seq: g.st === 'q' ? null : g.seq, alive: g.alive, lastOut: g.st === 'rev' ? g.lastOut : null, done: Object.keys(g.ans)}; },
  me(S, g, pid){ return {mine: g.ans[pid] || null, alive: g.alive.includes(pid)}; },
  fast: true,
  litAt(gp, v){ if (gp.st !== 'show') return -1; const sp = gp.sp || 760; const rel = v - gp.t0 - 700; if (rel < 0) return -1; const k = Math.floor(rel / sp); if (k >= gp.seq.length || rel % sp > sp * .75) return -1; return k; },
  pads(lit, live){ return `<div class="pads">${MEM_COLORS.map((c, i) => live ? `<button class="pad" data-pad="${i}" style="--pc:${c[1]}"></button>` : `<div class="pad ${lit === i ? 'lit' : ''}" style="--pc:${c[1]}"></div>`).join('')}</div>`; },
  tv(P, gp, v){ const k = this.litAt(gp, v); const lit = k >= 0 ? gp.seq[k] : -1; if (k >= 0 && TVS.memBeep !== gp.r + ':' + k){ TVS.memBeep = gp.r + ':' + k; tone(MEM_COLORS[lit][2], .35, 'triangle', .14); }
    const head = `<div class="rtag">Ronda ${gp.r + 1} · ${gp.len} colores · quedan ${gp.alive.length}</div>`;
    if (gp.st === 'rev') return `<div class="gq">${head}<div class="seqrow">${gp.seq.map(i => `<i style="background:${MEM_COLORS[i][1]}"></i>`).join('')}</div>${gp.lastOut && gp.lastOut.length ? `<h2 class="q">Fuera: ${gp.lastOut.map(p => esc(pOf(P, p).name)).join(', ')}</h2>` : '<h2 class="q">¡Nadie falla! Más rápido…</h2>'}<div class="mini">${gp.alive.map(p => chipH(pOf(P, p))).join('')}</div></div>`;
    return `<div class="gq">${head}<div class="tag">${gp.st === 'show' ? `Memorizad ${gp.len} colores` : '¡Repetidla en el móvil!'}</div>${this.pads(lit)}${gp.st === 'q' ? barH(gp.t0, gp.t1) + answeredRow(Object.assign({}, P, {players: P.players.filter(p => gp.alive.includes(p.pid))}), gp.done) : ''}</div>`; },
  ph(P, gp, M){ if (!M.alive) return waitPh('Eliminado', 'Mira la tele: a ver quién aguanta más');
    if (gp.st === 'rev') return M.mine && M.mine.ok ? phVerdict(true, 'Sigues dentro') : phVerdict(false, 'Te has equivocado');
    if (gp.st === 'show') return waitPh('Mira la tele', `Memoriza ${gp.len} colores`); if (M.mine) return waitPh('Enviado', 'Espera a los demás');
    const inp = PH.gs['m' + gp.r] || []; return `<div class="mprog">${Array.from({length: gp.len}, (_, i) => `<i class="${i < inp.length ? 'on' : ''}" style="${i < inp.length ? 'background:' + MEM_COLORS[inp[i]][1] : ''}"></i>`).join('')}</div>${this.pads(-1, true)}`; },
  pad(P, gp, i){ if (gp.st !== 'q') return null; const k = 'm' + gp.r; const inp = PH.gs[k] = (PH.gs[k] || []).concat(i); tone(MEM_COLORS[i][2], .22, 'triangle', .12); return inp.length >= gp.len ? {a: 'seq', r: gp.r, s: inp} : null; },
  bot(S, g, pid, v){ if (g.st === 'q' && g.alive.includes(pid) && !g.ans[pid] && v - g.t0 > 2000 + Math.random() * 3000) this.act(S, g, pid, {a: 'seq', r: g.r, s: Math.random() < .95 - g.seq.length * .05 ? g.seq : g.seq.map(() => rnd(4))}, v); },
});

// ---------- La Carrera de Caballos: cada uno a su ritmo ----------
function miniQ(){ const t = rnd(5);
  if (t === 0){ const a = 2 + rnd(9), b = 2 + rnd(9); const r = a + b; const o = shuffle([r, r + 1, r - 1, r + 2]); return {q: `${a} + ${b}`, o: o.map(String), c: o.indexOf(r)}; }
  if (t === 1){ const a = 2 + rnd(8), b = 2 + rnd(6); const r = a * b; const o = shuffle([r, r + a, r - b, r + 1]); return {q: `${a} × ${b}`, o: o.map(String), c: o.indexOf(r)}; }
  if (t === 2){ const c = rnd(4); return {q: `Pulsa el ${MEM_COLORS[c][0].toUpperCase()}`, colors: true, o: MEM_COLORS.map(x => x[0].toUpperCase()), c}; }
  if (t === 3){ const a = 10 + rnd(90), b = 10 + rnd(90); if (a === b) return miniQ(); return {q: '¿Cuál es mayor?', o: [String(a), String(b)], c: a > b ? 0 : 1}; }
  const w = pick(['GATO', 'LUNA', 'CASA', 'MESA', 'PERRO', 'FUEGO', 'NUBE', 'TREN']); const bad = w.split('').reverse().join(''); return {q: `¿Cuál está bien escrita?`, o: shuffle([w, bad, w.slice(1) + w[0]]), c: -1, word: w}; }
const fixQ = Q => { if (Q.c === -1) Q.c = Q.o.indexOf(Q.word); return Q; };
def('caballos', {name: 'La Carrera de Caballos', cat: 'Rapidez', icon: '🏇', desc: 'Preguntas relámpago en tu móvil, cada uno a su ritmo. Acierta y tu caballo avanza; falla y retrocede.',
  rules: ['Cada uno recibe en su móvil preguntas rapidísimas: sumas, «pulsa el rojo», ¿cuál es mayor?…', 'Acierto: tu caballo avanza. Fallo: retrocede. Al momento te sale otra.', 'Mirad la tele: los tres primeros en cruzar la meta ganan.'], ri: ['📱', '🏇', '🏁'], ctl: 'Botones grandes',
  init(S){ return {pos: {}, fin: [], st: 'wait', goal: 12, Q: {}, k: {}, last: {}}; },
  start(S, g, v){ g.st = 'q'; g.t0 = v; g.t1 = v + 75000; pidsAll(S).forEach(p => { g.pos[p] = 0; g.k[p] = 0; g.Q[p] = fixQ(miniQ()); }); },
  step(S, g, v){ if (g.st === 'q' && (v >= g.t1 || g.fin.length >= Math.min(3, pidsAll(S).length) || pidsAll(S).every(p => g.fin.includes(p)))){ g.st = 'rev'; g.t0 = v; g.t1 = v + 6000; return false; }
    return g.st === 'rev' && v >= g.t1; },
  act(S, g, pid, a, v){ if (a.a !== 'ans' || g.st !== 'q' || g.fin.includes(pid) || +a.k !== g.k[pid]) return false; const ok = +a.i === g.Q[pid].c;
    g.pos[pid] = Math.max(0, (g.pos[pid] || 0) + (ok ? 1 : -1)); g.last[pid] = ok; if (g.pos[pid] >= g.goal && !g.fin.includes(pid)) g.fin.push(pid); g.k[pid]++; g.Q[pid] = fixQ(miniQ()); return true; },
  result(S, g){ const raw = {}; pidsAll(S).forEach(p => { const i = g.fin.indexOf(p); raw[p] = i >= 0 ? 3000 - i * 400 : (g.pos[p] || 0) * 100; }); return {raw}; },
  pub(S, g){ return {st: g.st, t0: g.t0, t1: g.t1, pos: g.pos, fin: g.fin, goal: g.goal}; },
  me(S, g, pid){ const Q = g.Q[pid]; return {Q: Q ? {q: Q.q, o: Q.o, colors: Q.colors} : null, k: g.k[pid], pos: g.pos[pid] || 0, fin: g.fin.indexOf(pid), last: g.last[pid]}; },
  tv(P, gp){ if (gp.st === 'rev') return `<div class="gq"><h2 class="q">¡Foto finish!</h2><div class="podline">${gp.fin.map((p, i) => `<div class="pp${i + 1}">${avH(pOf(P, p), 'lg')}<b>${i + 1}º ${esc(pOf(P, p).name)}</b></div>`).join('') || '<p class="note">Nadie llegó a la meta.</p>'}</div></div>`;
    return `<div class="gq horseq"><h2 class="q">¡Corred! Contestad en el móvil</h2>${barH(gp.t0, gp.t1)}<div class="track">${P.players.map(p => { const d = gp.pos[p.pid] || 0; const f = gp.fin.indexOf(p.pid);
      return `<div class="tr-l"><span class="tr-n">${avH(p, 'sm')}<b>${esc(p.name)}</b></span><div class="tr-run"><i class="tr-h ${f >= 0 ? 'fin' : ''}" style="left:${Math.min(100, d / gp.goal * 100)}%">🏇</i></div><em>${f >= 0 ? f + 1 + 'º' : d}</em></div>`; }).join('')}</div></div>`; },
  ph(P, gp, M){ if (gp.st === 'rev') return phVerdict(M.fin >= 0, M.fin >= 0 ? `Cruzaste la meta el ${M.fin + 1}º` : 'Tu caballo llegó al paso ' + M.pos);
    if (M.fin >= 0) return waitPh('¡Meta!', `Has llegado el ${M.fin + 1}º`); if (!M.Q) return waitPh('Preparados…');
    const fb = M.last == null ? '' : `<div class="hfb ${M.last ? 'ok' : 'ko'}">${M.last ? '¡Galopa!' : '¡Tropiezo!'}</div>`;
    return `<div class="pprog horse"><i style="width:${Math.round(M.pos / gp.goal * 100)}%"></i><span>🏇 ${M.pos}/${gp.goal}</span></div>${fb}<p class="pq big center">${esc(M.Q.q)}</p><div class="pbtns n${M.Q.o.length}">${M.Q.o.map((o, i) => gbtn({a: 'ans', k: M.k, i}, `<span>${esc(o)}</span>`, 'ob', M.Q.colors ? `style="--oc:${MEM_COLORS[i][1]}"` : '')).join('')}</div>`; },
  bot(S, g, pid, v){ if (g.st !== 'q' || g.fin.includes(pid) || Math.random() > .3) return; this.act(S, g, pid, {a: 'ans', k: g.k[pid], i: Math.random() < .75 ? g.Q[pid].c : rnd(g.Q[pid].o.length)}, v); },
});

// ---------- La Patata Caliente: con un objeto de verdad ----------
def('patata', {name: 'La Patata Caliente', cat: 'Caos', icon: '💣', desc: 'Un objeto de verdad pasa de mano en mano mientras la tele da órdenes. Cuando explote, que no lo tengas tú.', min: 3,
  rules: ['Coged un objeto que se pueda pasar: un cojín, una naranja, un peluche…', 'La tele dice quién empieza. Pasadlo de mano en mano y haced caso de lo que vaya diciendo la tele.', 'Nadie sabe cuándo explota. Cuando explote, votad en el móvil quién lo tenía: ese pierde.'], ri: ['🥔', '📺', '💥'], ctl: 'Solo para votar',
  init(S){ return {st: 'wait', r: 0, n: 3, obj: pick(PATATA_OBJ), votes: {}, losers: [], cmd: null}; },
  start(S, g, v){ this.arm(S, g, v); },
  arm(S, g, v){ g.st = 'q'; g.start = pick(pidsAll(S)); g.t0 = v; g.boom = v + 22000 + rnd(26000); g.nextCmd = v + 7000 + rnd(3000); g.cmd = null; g.votes = {}; },
  step(S, g, v){
    if (g.st === 'q'){ if (v >= g.nextCmd){ g.cmd = pick(PATATA_CMDS.filter(c => c !== g.cmd)); g.cmdAt = v; g.nextCmd = v + 5500 + rnd(4000); }
      if (v >= g.boom){ g.st = 'vote'; g.t0 = v; g.t1 = v + 16000; } return false; }
    if (g.st === 'vote'){ const on = pidsOn(S); if (v >= g.t1 || (v - g.t0 > 2500 && on.length && on.every(p => g.votes[p]))){ const c = {}; Object.values(g.votes).forEach(x => c[x] = (c[x] || 0) + 1);
        const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0]; g.loser = top ? top[0] : null; if (g.loser) g.losers.push(g.loser); g.st = 'rev'; g.t0 = v; g.t1 = v + 5000; } return false; }
    if (g.st === 'rev' && v >= g.t1){ g.r++; if (g.r >= g.n) return true; this.arm(S, g, v); }
    return false; },
  act(S, g, pid, a){ if (a.a !== 'who' || g.st !== 'vote' || !S.players[a.pid]) return false; g.votes[pid] = a.pid; return true; },
  result(S, g){ const raw = {}; pidsAll(S).forEach(p => raw[p] = 300); g.losers.forEach(p => raw[p] = (raw[p] || 300) - 150); return {raw}; },
  pub(S, g){ return {st: g.st, r: g.r, n: g.n, t0: g.t0, t1: g.t1, start: g.start, cmd: g.cmd, cmdAt: g.cmdAt, obj: g.obj, loser: g.st === 'rev' ? g.loser : null, done: Object.keys(g.votes), boomIn: g.st === 'q' ? g.boom - g.t0 : 0}; },
  me(S, g, pid){ return {mine: g.votes[pid] || null}; },
  fast: true,
  tv(P, gp, v){ const head = `<div class="rtag">Ronda ${gp.r + 1} de ${gp.n}</div>`;
    if (gp.st === 'q'){ const el = v - gp.t0; const beat = el % Math.max(220, 900 - el / 60) < 80; if (beat && TVS.patBeat !== Math.floor(el / 200)){ TVS.patBeat = Math.floor(el / 200); tone(el > 25000 ? 880 : 660, .05, 'square', .06); }
      if (gp.cmd && TVS.patCmd !== gp.cmdAt){ TVS.patCmd = gp.cmdAt; try { SFX.stinger(); } catch {} say(gp.cmd); }
      const S0 = pOf(P, gp.start); return `<div class="gq patata">${head}<div class="pat-start">${el < 6000 ? `Empieza ${avH(S0, 'lg')}<b>${esc(S0.name)}</b> con ${esc(gp.obj)}` : ''}</div><div class="pat-bomb ${beat ? 'tick' : ''}">💣</div><h2 class="q big pat-cmd">${esc(gp.cmd || '¡Pasadla!')}</h2></div>`; }
    if (gp.st === 'vote'){ if (TVS.patBoom !== gp.t0){ TVS.patBoom = gp.t0; try { SFX.boom(); } catch {} } return `<div class="gq patata">${head}<div class="pat-boom">💥</div><h2 class="q big">¡BOOM! ¿Quién la tenía?</h2><p class="note">Votad en el móvil</p>${barH(gp.t0, gp.t1)}${answeredRow(P, gp.done)}</div>`; }
    const L = gp.loser && pOf(P, gp.loser); return `<div class="gq patata">${head}${L ? `<div class="spot"><div class="spot-p">${avH(L, 'xl')}<b>${esc(L.name)}</b></div><div class="spot-n">¡Le ha explotado!</div></div>` : '<h2 class="q">Nadie se pone de acuerdo…</h2>'}</div>`; },
  ph(P, gp, M){ if (gp.st === 'q') return waitPh('¡Pasad el objeto!', 'Haced caso a la tele. El móvil, al bolsillo.');

// ---------- Corre o muere: la policía os persigue ----------
const CR = {}; // la simulación vive en la tele, fuera del estado que viaja a los móviles
const JOY = {};
const CR_W = 1600, CR_H = 900, CR_R = 30, CR_PR = 34;
def('corre', {name: 'Corre o Muere', cat: 'Acción', icon: '🏃', desc: 'La policía ha entrado en el club. Usa el móvil como mando, empuja a los demás y que no te pillen. El último en pie gana.', min: 2,

  init(S){ const id = uid(6); return {id, st: 'wait', out: [], alive: pidsAll(S).slice()}; },
  start(S, g, v){ g.st = 'q'; g.t0 = v; g.t1 = v + 150000; const ps = pidsAll(S); const C = CR[g.id] = {pl: {}, po: [], last: v, nextPo: v + 9000, t0: v};
    ps.forEach((p, i) => { const a = i / ps.length * Math.PI * 2; C.pl[p] = {x: CR_W / 2 + Math.cos(a) * 260, y: CR_H / 2 + Math.sin(a) * 200, vx: 0, vy: 0, kx: 0, ky: 0, dash: 0, cd: 0}; });
    C.po.push({x: 60, y: 60}, {x: CR_W - 60, y: CR_H - 60}); },
  step(S, g, v){ if (g.st === 'rev') return v >= g.t1; if (g.st !== 'q') return false; const C = CR[g.id]; if (!C){ g.st = 'rev'; g.t1 = v + 4000; return false; }
    let dt = Math.min(.2, (v - C.last) / 1000); C.last = v; const el = (v - C.t0) / 1000;
    if (v >= C.nextPo && C.po.length < 10){ const c = pick([[60, 60], [CR_W - 60, 60], [60, CR_H - 60], [CR_W - 60, CR_H - 60]]); C.po.push({x: c[0], y: c[1]}); C.nextPo = v + Math.max(4000, 9000 - el * 60); }
    const steps = Math.ceil(dt / .05); dt /= steps;
    for (let s = 0; s < steps; s++){
      const alive = g.alive.filter(p => C.pl[p]);
      alive.forEach(p => { const P_ = C.pl[p]; const j = JOY[p] || (S.players[p].bot ? crBot(C, P_) : {x: 0, y: 0}); if (j.dash && P_.cd <= 0){ P_.dash = .28; P_.cd = 2.2; j.dash = 0; }
        const sp = 300 * (P_.dash > 0 ? 2.4 : 1); P_.vx = j.x * sp + P_.kx; P_.vy = j.y * sp + P_.ky; P_.kx *= Math.pow(.02, dt); P_.ky *= Math.pow(.02, dt); P_.dash -= dt; P_.cd -= dt;
        P_.x = Math.max(CR_R, Math.min(CR_W - CR_R, P_.x + P_.vx * dt)); P_.y = Math.max(CR_R, Math.min(CR_H - CR_R, P_.y + P_.vy * dt)); });
      // choques entre jugadores: se apartan y el que embiste empuja
      for (let i = 0; i < alive.length; i++) for (let k = i + 1; k < alive.length; k++){ const a = C.pl[alive[i]], b = C.pl[alive[k]]; const dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 1; if (d < CR_R * 2){
        const nx = dx / d, ny = dy / d, ov = CR_R * 2 - d; a.x -= nx * ov / 2; a.y -= ny * ov / 2; b.x += nx * ov / 2; b.y += ny * ov / 2;

class Engine {
  constructor(hub, ctx, S){ this.hub = hub; this.ctx = ctx; this.S = S; this.rooms = {}; this.dirty = true; this.lastPub = 0; this.lastSave = 0; this.onChange = null; }
  async start(){
    this.pub = this.hub.room(roomPub(this.ctx.room)); await this.pub.ready();
    this.pub.onActions(a => this.handlePub(a));
    for (const pid of this.S.order){ const p = this.S.players[pid]; if (p && !p.bot) await this.attach(pid); }
    setInterval(() => this.loop(), 100);
    this.publish(true);
  }
  async attach(pid){ const p = this.S.players[pid]; if (!p || p.bot || (this.rooms[pid] && this.rooms[pid]._tok === p.tok)) return; const old = this.rooms[pid]; if (old) try { old.setKey('me', {gone: true, moved: true, ts: Date.now()}); } catch {} const r = this.hub.room(roomPlayer(this.ctx.room, p.tok)); r._tok = p.tok; this.rooms[pid] = r; await r.ready(); r.onActions(a => { if (a.tok === p.tok && a.t === 'foto' && typeof ftRecv === 'function') return ftRecv(this, pid, a); if (a.tok === p.tok && a.t === 'joy' && typeof joyRecv === 'function') return joyRecv(pid, a); if (a.tok !== p.tok) return; if (playerAct(this.S, pid, a)) this.change(); }); }
  handlePub(a){
    if (a.t !== 'join' || !a.tok) return;
    const r = joinPlayer(this.S, a);
    if (r && r.err){ const room = this.hub.room(roomPlayer(this.ctx.room, a.tok)); room.ready().then(() => room.setKey('me', {rejected: r.err, ts: Date.now()})); return; }
    this.attach(r).then(() => this.change());
    this.change();
  }
  host(op, a){ if (hostCmd(this.S, op, a || {})) this.change(); }
  change(){ this.dirty = true; }
  loop(){
    if (tick(this.S)) this.dirty = true;
    const now = Date.now();
    if (this.dirty || now - this.lastPub > 1000) this.publish();
    if (this.S.phase === 'final' && this.S.award && this.lastAward !== this.S.award.id){ this.lastAward = this.S.award.id; clubMerge(this.S.award); TVS.lastHTML = ''; }
    if (this.onChange) this.onChange(this.S);
  }
  publish(force){
    const S = this.S; S.rev++; const now = Date.now(); this.lastPub = now;
    const pv = Object.assign(pubView(S), {ts: now}); this.pubV = pv;
    this.pub.setKey('pub', pv);
    for (const pid of S.order){ const r = this.rooms[pid]; if (r) r.setKey('me', Object.assign(meView(S, pid), {ts: now, rev: S.rev})); }
    if (this.dirty || force || now - this.lastSave > 3000){ this.lastSave = now; S.savedAt = now; try { localStorage.setItem('ccsn-S-' + S.room, JSON.stringify(S)); } catch {} }
    this.dirty = false;
  }
}

function phLoop(){ const P = PH.pub; const fast = P && P.phase === 'play' && GAMES[P.game.k].fast; const now = performance.now(); if (fast || now - (PH.lastLoop || 0) > 250 || (P && P.phase === 'count')){ PH.lastLoop = now; phRender(); } requestAnimationFrame(phLoop); }

// ---------- lienzo de dibujo ----------
function cvBind(){
  const cv = $('#cv'); if (!cv || cv.dataset.bound) return; cv.dataset.bound = 1; const ctx = cv.getContext('2d');
  const strokes = PH.gs.strokes ||= []; let cur = null;
  const redraw = () => { ctx.fillStyle = '#f5efe3'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.strokeStyle = '#1b1720'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    strokes.forEach(s => { ctx.beginPath(); for (let i = 0; i + 1 < s.length; i += 2){ const x = s[i] * cv.width / 1000, y = s[i + 1] * cv.height / 1000; if (!i) ctx.moveTo(x, y); else ctx.lineTo(x, y); } if (s.length === 2){ ctx.arc(s[0] * cv.width / 1000, s[1] * cv.height / 1000, 4, 0, 7); } ctx.stroke(); }); };
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000), Math.round((e.clientY - r.top) / r.height * 1000)]; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = pos(e); strokes.push(cur); redraw(); };
  cv.onpointermove = e => { if (!cur) return; const [x, y] = pos(e); const lx = cur[cur.length - 2], ly = cur[cur.length - 1]; if (Math.hypot(x - lx, y - ly) < 8) return; if (cur.length < 800) cur.push(x, y); redraw(); };
  cv.onpointerup = cv.onpointercancel = () => { cur = null; PH.gs.dirty = true; };
  redraw();
  clearInterval(PH.cvT); PH.cvT = setInterval(() => { const P = PH.pub; if (!P || !P.gp || P.gp.st !== 'draw'){ clearInterval(PH.cvT); return; } if (PH.gs.dirty){ PH.gs.dirty = false; phSend({t: 'g', a: 'draw', s: strokes}); } if (!PH.gs.live && phV() > P.gp.t1 - 400 && !PH.gs.finalSent){ PH.gs.finalSent = true; phSend({t: 'g', a: 'draw', s: strokes, done: true}); } }, PH.gs.live ? 350 : 1500);
  PH.gs.redraw = redraw;
}

function phBind(){

    if (d.kpsend){ const b = PH.gs[d.kpsend]; if (!b) return; const def = GAMES[P.game.k]; phSend(Object.assign({t: 'g'}, def.kpSend(d.kpsend, +b))); PH.gs[d.kpsend] = ''; tap(); phRender(); return; }
    if (d.ord != null && P.phase === 'play'){ const a = GAMES.orden.ord(P.gp, +d.ord); if (a) phSend(Object.assign({t: 'g'}, a)); tap(); phRender(); return; }
    if (d.ordreset){ PH.gs['o' + P.gp.r] = []; phRender(); return; }
    if (d.word){ const i = $('#' + d.word); if (i && i.value.trim()){ phSend({t: 'g', a: 'word', w: i.value.trim()}); i.value = ''; } return; }
    if (d.bid != null){ const b = PH.gs.bid ||= [0, 0, 0, 0, 0]; const i = +d.bid; b[i] = Math.max(0, b[i] + (+d.d)); if (sum(b) > M.fichas) b[i]--; tap(); phRender(); return; }
    if (d.bidsend){ phSend({t: 'g', a: 'bid', b: PH.gs.bid || [0, 0, 0, 0, 0]}); return; }

    if (d.dv){ const s = [0, 1, 2].map(k => ($('#dv' + k) || {}).value || ''); if (s.some(x => !x.trim())) return toast('Rellena las tres frases'); phSend({t: 'g', a: 'dv', s}); return; }
    if (d.clue){ const i = $('#' + d.clue); if (i && i.value.trim()) phSend({t: 'g', a: 'clue', w: i.value.trim()}); return; }
    if (d.cv){ const s = PH.gs.strokes ||= []; if (d.cv === 'undo') s.pop(); if (d.cv === 'clear') s.length = 0; PH.gs.dirty = true; if (PH.gs.redraw) PH.gs.redraw(); if (d.cv === 'done'){ if (!s.length) return toast('Dibuja algo primero'); phSend({t: 'g', a: 'draw', s, done: true}); PH.gs.finalSent = true; } return; }

  });
  document.addEventListener('keydown', e => { if (e.key !== 'Enter') return; const i = e.target; if (i.id && i.id.startsWith('bw')){ $(`[data-word="${i.id}"]`).click(); } if (i.id === 'clue') $('[data-clue]').click(); if (i.id === 'jname') $('#jgo') && $('#jgo').click(); if (i.id === 'jcode') $('#jc') && $('#jc').click(); });
}

    <div id="hostbar"><button class="hb" id="pausebtn" data-host="pausetoggle">Pausa</button><button class="hb" data-host="skip">Saltar</button><button class="hb" data-host="end">Terminar</button><button class="hb" data-host="inter" id="interbtn">Intermedio</button><button class="hb" data-host="panel" id="panelbtn">🎛️ Panel</button><button class="hb" data-sm="open">Sin móviles</button><label class="hb vol">Volumen <input type="range" id="vol" min="0" max="1" step="0.05" value="${VOL}"></label><button class="hb" id="voicebtn">Voz: sí</button><button class="hb" id="fsbtn">Pantalla completa</button></div>
    <div id="tvstart"><div>${logoH('big')}<button class="btn gold huge">Abrir las puertas del club</button><p>Activa la música y los sonidos. Después, pantalla completa.</p></div></div>`;
  $('#tvstart button').onclick = () => { ac(); pickVoice(); $('#tvstart').remove(); try { document.documentElement.requestFullscreen().catch(() => {}); } catch {} TVS.lastPhase = null; };
  await connectHub(ctx);
  let S = null; try { S = JSON.parse(localStorage.getItem('ccsn-S-' + ctx.room) || 'null'); } catch {}
  if (!S || S.room !== ctx.room) S = newState(ctx.room, ctx.mode);
  if (!S.hostKey) S.hostKey = hostKeyNew();
  else if (!S.pause && !['lobby', 'final'].includes(S.phase) && S.savedAt) S.pause = {at: S.savedAt};
  // tras recargar, el tiempo en pausa o de desconexión no cuenta
  E = new Engine(HUB, ctx, S); window.__E = E; try { const g = JSON.parse(localStorage.getItem('ccsn-guests') || 'null'); if (g && g.length && !(E.S.club && E.S.club.guests && E.S.club.guests.length)) setTimeout(() => E.host('guests', {names: g}), 300); } catch {}
  JOINURL = linkFor('p', ctx);
  E.onChange = () => renderTV(E);
  await E.start();
  requestAnimationFrame(timerLoop);
  bindHost(); formAutoLoad();
}
function bindHost(){
  let tHide; document.addEventListener('mousemove', () => { document.body.classList.add('mouse'); clearTimeout(tHide); tHide = setTimeout(() => document.body.classList.remove('mouse'), 2500); });
  document.addEventListener('click', e => { const t = e.target.closest('[data-host]'); if (!t) return; e.stopPropagation(); const d = t.dataset; let op = d.host;
    if (op === 'pausetoggle') op = E.S.pause ? 'resume' : 'pause';
    if (op === 'editor') return openEditor();
    if (op === 'club') return clubOverlay();
    if (op === 'quiz') return quizOverlay();
    if (op === 'ajustes') return cfgOverlay();
    if (op === 'voz') return vozOverlay();
    if (op === 'panel') return hostPanel();
    if (op === 'print') return printables();
    if (op === 'wipe') return salaWipe(t);
    if (op === 'album') return albumOverlay();
    if (op === 'testgames') return testGamesOverlay();
    if (op === 'hostlink') return hostLinkOverlay();
    if (op === 'start' && E.S.gm === 'noche' && pidsAll(E.S).length < 3) return toast('La Noche necesita al menos 3 miembros.');
    if (op === 'end' && !TVS.confirmEnd && E.S.phase !== 'final'){ TVS.confirmEnd = true; toast('Pulsa otra vez «Terminar» para acabar la partida'); setTimeout(() => TVS.confirmEnd = false, 3000); return; }
    if (op === 'start'){ const err = pidsAll(E.S).length < 2 ? 'Hacen falta al menos 2 jugadores.' : null; if (err) return toast(err); }
    E.host(op, {len: d.len, n: d.n ? +d.n : undefined, pid: d.pid, gm: d.gm, ev: d.ev, mode: d.mode}); if ($('#hostov.on')) setTimeout(hostPanel, 80); });
  $('#vol').oninput = e => setVol(+e.target.value);
  $('#voicebtn').onclick = () => { voiceOn = !voiceOn; $('#voicebtn').textContent = 'Voz: ' + (voiceOn ? 'sí' : 'no'); };
  $('#fsbtn').onclick = () => { try { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); } catch {} };
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.code === 'Space'){ e.preventDefault(); E.host(E.S.pause ? 'resume' : 'pause'); } if (e.key === 'n' || e.key === 'N') E.host('skip'); });
}

async function bootPlayer(ctx, p){
  document.body.className = 'v-ph';
  PH.ctx = ctx; await connectHub(ctx);
  PH.pubChan = HUB.room(roomPub(ctx.room)); await PH.pubChan.ready();
  let gotPub = false;
  PH.pubChan.onKey('pub', v => { if (!v){ return; } gotPub = true; PH.pub = v; if (v.ts){ PH.offs.push(v.ts - Date.now()); if (PH.offs.length > 20) PH.offs.shift(); PH.off = Math.max(...PH.offs); } if (!PH.tok && $('.ph.join') && !$('#jname:focus')) { /* refresca avatares ocupados */ } phRender(); });
  phBind(); requestAnimationFrame(phLoop); requestAnimationFrame(timerLoop); VNOW = phV;
  const tok = phStore().getItem('ccsn-tok-' + ctx.room);
  PH.enc = p.get('enc'); PH.hk = p.get('h') || phStore().getItem('ccsn-hk-' + ctx.room); if (PH.hk) phStore().setItem('ccsn-hk-' + ctx.room, PH.hk); if (tok) phConnect(tok); else phJoin();
  setTimeout(() => { if (!gotPub && !PH.me) phCodeScreen('No encuentro esa sala. Revisa el código de la tele.'); }, 9000);
}

window.addEventListener('DOMContentLoaded', async () => {
  const {view, p} = parseHash();
  try {
    if (view === 'tv'){ const ctx = ctxFromURL(p); if (ctx) return await bootTV(ctx); }
    if (view === 'firmas'){ const ctx = ctxFromURL(p); if (ctx) return await bootBook(ctx); }
    if (view === 'casino'){ const ctx = ctxFromURL(p); if (ctx) return await bootCasino(ctx, p); }
    if (view === 'p'){ const ctx = ctxFromURL(p); if (ctx) return await bootPlayer(ctx, p); return phCodeScreen(); }
    landing();
  } catch (e){ console.error(e); $('#app').innerHTML = `<div class="land">${logoH('big')}<h2>No se pudo conectar</h2><p class="tagline">Revisa la conexión a internet y vuelve a intentarlo.</p><button class="btn gold" onclick="location.reload()">Reintentar</button></div>`; }
});
window.addEventListener('hashchange', () => location.reload());

</script></body></html>
