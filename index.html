<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Club Sin Nombre</title><meta name="theme-color" content="#0e1311">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --coal:#08090a; --coal2:#0d0d0d; --coal3:#171b19; --line:#2a302c;
  --gold:#c9a45c; --gold2:#e6cd92; --wine:#6b1a2c; --wine2:#9a2f45; --cream:#efe6d4; --mute:#a3a397; --dim:#68706a;
  --felt:#0f1312; --ok:#5fc48c; --ko:#e0586b;
  --disp:'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
  --serif:'Cormorant Garamond', Georgia, serif;
  --body:'Jost', 'Futura', 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--coal);color:var(--cream);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--cream);color:var(--coal);padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--line);background:var(--coal3);padding:12px 18px;border-radius:6px;font-weight:600;font-size:16px;letter-spacing:.04em;transition:transform .06s,background .15s}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:#a8843f;color:#1d1608;box-shadow:0 3px 0 #7d5f22,inset 0 0 0 1px #fff4;font-family:var(--disp);font-weight:700}
.btn.gold:active{box-shadow:0 1px 0 #7d5f22}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:10px}
.btn.huge{font-size:21px;padding:16px 22px}
.btn small{font-weight:400;font-size:12px;color:var(--mute)}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:14px;padding:8px}
.field{width:100%;background:var(--coal2);border:2px solid var(--line);color:var(--cream);padding:12px 14px;font:inherit;font-size:17px;border-radius:12px}
.field.big{font-size:22px;padding:14px 16px}
.field.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-family:var(--disp);font-size:34px}
.lab{display:block;font-size:14px;color:var(--mute);margin:16px 0 8px}
.muted{color:var(--mute)}.ok{color:var(--ok)}.err{color:var(--ko)}.up{color:var(--ok)}.down{color:var(--ko)}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}.row>.field{flex:1}
.hint{color:var(--dim);font-size:13px;text-align:center}

/* ---------- logo: el sello de la invitación ---------- */
.logo{display:inline-flex;align-items:center;gap:16px;color:var(--gold)}
.seal{width:64px;height:64px;flex:none;color:var(--gold)}
.seal .st{font-family:var(--body);font-size:13px;letter-spacing:.22em;fill:currentColor;font-weight:500}.seal .st.sm{font-size:10px;letter-spacing:.18em}
.lt{display:flex;flex-direction:column;line-height:.95;font-family:var(--disp);color:var(--cream);text-align:left}
.lt span{font-size:20px;font-weight:600}.lt b{font-size:30px;font-weight:600}
.logo.big .seal{width:150px;height:150px}.logo.big .lt span{font-size:46px}.logo.big .lt b{font-size:64px}
.logo.mini .seal{width:34px;height:34px}.logo.mini .lt span{font-size:11px}.logo.mini .lt b{font-size:15px}
.logo.stack{flex-direction:column;gap:14px;text-align:center}.logo.stack .seal{width:120px;height:120px}.logo.stack .lt{text-align:center}.logo.stack .lt span{font-size:30px}.logo.stack .lt b{font-size:38px}
.inv-k,.kick-l{font-family:var(--body);letter-spacing:.42em;color:var(--gold);font-weight:500;font-size:13px;text-align:center}
.inv-t{font-family:var(--serif);font-style:italic;font-size:22px;text-align:center;margin:4px 0 0;color:var(--cream)}
.rule{display:flex;align-items:center;gap:10px;color:var(--gold);justify-content:center}.rule::before,.rule::after{content:'';height:1px;width:80px;background:currentColor;opacity:.6}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:radial-gradient(circle,var(--gold2) 0 30%,transparent 31%),repeating-conic-gradient(var(--gold) 0 30deg,var(--cream) 30deg 45deg);vertical-align:-.12em;box-shadow:inset 0 0 0 .12em #8a6a2c,0 1px 0 #0008}

/* ---------- avatares ---------- */
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3,transparent 60%),var(--c,#555);box-shadow:inset 0 0 0 3px #0003,0 0 0 2px #fff2;font-size:24px;line-height:1;flex:none}
.av.sm{width:30px;height:30px;font-size:17px}.av.md{width:44px;height:44px;font-size:26px}.av.lg{width:64px;height:64px;font-size:38px}.av.xl{width:96px;height:96px;font-size:58px}.av.xxl{width:150px;height:150px;font-size:94px}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--coal2);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;margin:4px}
.pchip em{font-style:normal;color:var(--gold2);font-weight:700}.pchip em.up{color:var(--ok)}.pchip em.down{color:var(--ko)}

/* ---------- portada ---------- */
.v-land{background:radial-gradient(ellipse at 50% 0%,#191d1c 0,var(--coal) 60%);min-height:100vh}
.land{max-width:900px;margin:0 auto;padding:7vh 24px;text-align:center}
.tagline{font-family:var(--serif);font-style:italic;color:var(--cream);font-size:24px;max-width:600px;margin:22px auto 34px;line-height:1.35}
.land-b{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;text-align:left}
.lb{background:var(--coal2);border:1px solid var(--line);border-radius:20px;padding:22px}
.lb h3{font-family:var(--disp);font-size:30px;margin:0 0 4px;font-weight:700}.lb p{color:var(--mute);margin:0 0 14px}
.seg{display:grid;gap:8px}.seg input{position:absolute;opacity:0}.seg span{display:block;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}.seg small{display:block;color:var(--mute);font-weight:400}
.seg input:checked+span{border-color:var(--gold);background:#2b2214}
@media(max-width:720px){.land-b{grid-template-columns:1fr}.logo.big .lt b{font-size:46px}}

/* ================= LA TELE ================= */
.v-tv{overflow:hidden;cursor:none}.v-tv.mouse{cursor:default}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,#19201d 0,#101311 45%,var(--coal) 80%);display:flex;flex-direction:column}
#stage::before{content:'';position:absolute;inset:1.6vh 1vw;pointer-events:none;border:1px solid #c9a45c88;outline:1px solid #c9a45c44;outline-offset:-.8vh;z-index:3}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000a 100%),repeating-linear-gradient(45deg,#ffffff03 0 2px,transparent 2px 5px)}
.ttop{position:relative;z-index:4;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:3.4vh 3.2vw 1vh;font-size:1.2vw;color:var(--mute)}
.ttop .tl{justify-self:start}.ttop .tc{font-family:var(--disp);font-size:1.7vw;color:var(--gold2);font-weight:600;letter-spacing:.04em}.ttop .tr{text-align:right}
.x2{color:var(--coal);background:var(--gold2);padding:.1em .45em;border-radius:.4em;font-style:normal;font-weight:800}
.scr{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:1vh 4vw 4vh;min-height:0}
.scr.anim>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(2vh) scale(.98)}to{opacity:1;transform:none}}

/* sala */
.lobby{display:grid;grid-template-columns:38vw 1fr;gap:4vw;width:100%;align-items:center}
.lob-l .logo.big .seal{width:11vw;height:11vw}.lob-l .logo.big .lt span{font-size:3vw}.lob-l .logo.big .lt b{font-size:4.2vw}
.lob-l .tagline{text-align:left;margin:3vh 0;font-size:2vw}
.join{display:flex;gap:2vw;align-items:center;background:var(--cream);color:var(--coal);border-radius:.6vw;padding:1.6vw;outline:1px solid var(--gold);outline-offset:.5vw}.join .kick-l{font-size:.9vw;color:#8a6a2c;text-align:left}
.join .qr{width:13vw;height:13vw;flex:none}.join .qr svg{width:100%;height:100%}.noqr{font-size:1vw}
.jt{display:flex;flex-direction:column;gap:.4vh;font-size:1.1vw}.jt .url{font-size:1.2vw;word-break:break-all}
.code{font-family:var(--disp);font-size:min(5vw,9vh);font-weight:700;letter-spacing:.08em;white-space:nowrap;line-height:1;color:var(--felt)}
.reh{margin-top:2vh;font-size:1vw;color:var(--mute)}.reh .lnk{font-size:1vw}
.mini-b{background:var(--coal3);border:1px solid var(--line);border-radius:8px;padding:.2em .6em;font-size:.9em}
.seats{display:flex;flex-wrap:wrap;gap:1.6vw 1.2vw;min-height:24vh;align-content:flex-start}
.seat{display:flex;flex-direction:column;align-items:center;gap:.6vh;width:8.4vw}
.seat .av.xl{width:6.6vw;height:6.6vw;font-size:4vw}
.seat b{font-size:1.15vw;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.off{opacity:.45}.seat.empty .av{background:transparent;box-shadow:inset 0 0 0 3px var(--line);animation:breathe 2s infinite}
.crown,.offl{font-style:normal;font-size:.8vw;color:var(--gold2)}.offl{color:var(--ko)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes breathe{50%{opacity:.4}}
.lens{display:grid;grid-template-columns:repeat(5,1fr);gap:.7vw;margin:3vh 0 2vh}
.lenb{display:flex;flex-direction:column;gap:.3vh;text-align:left;border:2px solid var(--line);background:var(--coal2);border-radius:1vw;padding:1vw;cursor:pointer;position:relative}
.lenb b{font-family:var(--disp);font-size:1.5vw}.lenb span{font-size:.85vw;color:var(--mute)}
.lenb em{position:absolute;top:-1.2vh;right:.8vw;font-style:normal;font-size:.8vw;background:var(--wine2);padding:.2em .6em;border-radius:999px}
.lenb.on{border-color:var(--gold);background:#2b2214}
.v-tv .btn.gold.huge{font-size:1.9vw;padding:1.6vh 2vw;width:100%}
.lob-r .hint{font-size:.95vw;margin-top:1.4vh}

/* presentación */
.intro{display:flex;flex-direction:column;align-items:center;gap:3vh}
.card3d{width:44vw;padding:5vh 3vw;text-align:center;border-radius:1vw;background:linear-gradient(160deg,#151816,#0c0d0d 70%);border:1px solid var(--gold);outline:1px solid #c9a45c66;outline-offset:-1.2vh;box-shadow:0 3vh 8vh #000c;animation:flip 1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flip{from{transform:perspective(1200px) rotateY(-100deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.gicon{font-size:9vw;line-height:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1vh) rotate(-4deg)}}
.gcat{color:var(--gold);font-size:1.1vw;font-weight:500;letter-spacing:.42em;margin-top:1vh;text-transform:uppercase}
.card3d h1{font-family:var(--disp);font-size:4.4vw;margin:1vh 0;line-height:1.02;font-weight:600}
.card3d p{font-family:var(--serif);font-style:italic;font-size:2vw;color:var(--cream);opacity:.9;margin:0}
.gnum{color:var(--mute);font-size:1.3vw}
.x2big{font-family:var(--disp);font-size:2.6vw;color:var(--coal);background:var(--gold2);padding:.2em .8em;border-radius:.4em;animation:pulse .9s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}

/* instrucciones */
.rules{display:grid;grid-template-columns:1.3fr 1fr;gap:4vw;width:100%;align-items:center}
.rl{font-size:5vw}.rl h2{font-family:var(--disp);font-size:4vw;margin:0 0 2vh;line-height:1}
.rl ol{margin:0;padding:0;list-style:none;counter-reset:r}
.rl li{counter-increment:r;font-size:2vw;line-height:1.35;margin:0 0 1.6vh;padding-left:4vw;position:relative;animation:rise .5s both}
.rl li:nth-child(2){animation-delay:.25s}.rl li:nth-child(3){animation-delay:.5s}
.rl li::before{content:counter(r);position:absolute;left:0;top:-.1em;width:2.8vw;height:2.8vw;border-radius:50%;background:var(--wine2);display:grid;place-items:center;font-family:var(--disp);font-size:1.8vw;font-weight:800}
.v-tv .ctl{font-size:1.5vw;color:var(--mute);margin-top:2vh}.ctl b{color:var(--gold2)}
.v-ph .ctl{color:var(--mute);font-size:15px}
.rtit{font-family:var(--disp);font-size:3vw;margin-bottom:2vh}
.rdots{display:flex;flex-wrap:wrap;gap:1vw}
.rd{display:flex;align-items:center;gap:.6vw;padding:.4vw 1vw .4vw .4vw;border-radius:999px;background:var(--coal2);border:2px solid var(--line);opacity:.5;font-size:1.1vw;transition:.3s}
.rd.on{opacity:1;border-color:var(--ok)}
.rd .av{width:2.6vw;height:2.6vw;font-size:1.6vw}

/* cuenta atrás */
.count{text-align:center}
.cn{font-family:var(--disp);font-size:30vh;font-weight:800;line-height:1;color:var(--gold2);text-shadow:0 1vh 0 var(--wine);animation:zoom 1s ease-out infinite}
@keyframes zoom{from{transform:scale(1.6);opacity:0}25%{opacity:1;transform:scale(1)}}
.cg{font-size:2vw;color:var(--mute)}

/* juego: piezas comunes */
.play{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.gq{width:100%;max-width:86vw;display:flex;flex-direction:column;align-items:center;gap:2.4vh;text-align:center}
.rtag{font-size:1vw;color:var(--gold);font-weight:500;letter-spacing:.38em;text-transform:uppercase}.rtag.caos{font-family:var(--disp);font-size:2vw;color:var(--coal);background:var(--gold2);padding:.1em .7em;border-radius:.4em}
.q{font-family:var(--disp);font-size:3.2vw;line-height:1.15;margin:0;font-weight:600;max-width:78vw}.q.big{font-size:4vw}
.tag{font-size:1.8vw;color:var(--gold2);font-weight:700}
.note{font-family:var(--serif);font-style:italic;color:var(--mute);font-size:1.8vw;margin:0}.msg{font-family:var(--serif);font-style:italic;font-size:2.2vw;margin:0}
.tbar{width:60vw;height:1.2vh;background:var(--coal3);border-radius:999px;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--wine2),var(--gold));transform-origin:left;border-radius:999px}
.arow{display:flex;gap:.6vw;flex-wrap:wrap;justify-content:center}
.adot{opacity:.25;transition:.3s;filter:grayscale(1)}.adot.on{opacity:1;filter:none;transform:scale(1.1)}
.adot .av{width:3vw;height:3vw;font-size:1.8vw}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;width:74vw}
.opts.n3{grid-template-columns:repeat(3,1fr)}.opts.n2{width:56vw}
.opt{position:relative;display:flex;align-items:center;gap:1.2vw;background:var(--oc);border-radius:.6vw;border:1px solid #fff3;padding:2vh 1.6vw;font-size:2.2vw;font-weight:700;text-align:left;color:#fff;box-shadow:0 .7vh 0 #0006;transition:.4s}
.opt i{font-style:normal;font-family:var(--disp);background:#0003;border-radius:.6vw;padding:.1em .45em}
.opt.lose{opacity:.25;transform:scale(.96)}.opt.win{transform:scale(1.04);box-shadow:0 0 0 .4vw var(--cream),0 0 5vw var(--oc)}
.opick{position:absolute;right:.8vw;bottom:-1.6vh;display:flex;gap:.2vw}
.opick .av{animation:pop .4s both}
.verd{}
/* barras de votos */
.bars{width:70vw;display:flex;flex-direction:column;gap:1.4vh}
.bar{display:grid;grid-template-columns:16vw 1fr 4vw;align-items:center;gap:1vw;position:relative;font-size:1.8vw;text-align:left}
.bt{height:5vh;background:var(--coal3);border-radius:.8vw;overflow:hidden}.bt i{display:block;height:100%;background:var(--oc);animation:grow 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.bar b{font-family:var(--disp);font-size:2.6vw}.bar.win .bl{color:var(--gold2)}.bar:not(.win){opacity:.55}
.bar .opick{position:static;grid-column:2;margin-top:-.6vh}
/* foco en una persona */
.spot{display:flex;flex-direction:column;align-items:center;gap:1vh}
.spot-p{display:inline-flex;flex-direction:column;align-items:center;margin:0 1.4vw}
.spot-p .av.xl{width:13vw;height:13vw;font-size:8vw;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.spot-p b{font-family:var(--disp);font-size:3.6vw}
.spot-n{font-size:1.6vw;color:var(--gold2)}
.mini{display:flex;flex-wrap:wrap;justify-content:center;max-width:80vw}
.mini .pchip{font-size:1.2vw}
/* mentiroso */
.wheel{width:9vw;height:9vw;border-radius:50%;background:conic-gradient(var(--wine2) 0 25%,var(--cream) 0 50%,var(--wine2) 0 75%,var(--cream) 0);box-shadow:0 0 0 .4vw var(--gold);animation:spin 1.2s linear infinite}
.wheel.stop{animation:spin 2s cubic-bezier(.1,.7,.2,1) 1 forwards}
@keyframes spin{to{transform:rotate(1turn)}}
.stamp{font-family:var(--disp);font-size:7vw;font-weight:800;padding:0 .4em;border:.5vw solid;border-radius:1vw;transform:rotate(-6deg);animation:stamp .4s cubic-bezier(.2,1.6,.4,1) both}
.stamp.tr{color:var(--ok)}.stamp.li{color:var(--ko)}
@keyframes stamp{from{transform:scale(3) rotate(-6deg);opacity:0}}
.bets{display:flex;flex-wrap:wrap;justify-content:center;max-width:80vw}.bets .pchip{font-size:1.2vw}
/* dilema */
.dcols{display:flex;gap:2vw;width:80vw}.dcol{flex:1;background:var(--coal2);border-top:.6vh solid var(--oc);border-radius:1vw;padding:1.6vh 1vw}
.dcol h3{font-family:var(--disp);font-size:2.4vw;margin:0}.dcol>b{font-family:var(--disp);font-size:4vw;color:var(--gold2)}.dcol .pchip{font-size:1.05vw}
/* precio */
.answer{font-family:var(--disp);font-size:7vw;color:var(--gold2);font-weight:800;line-height:1}.answer small{font-size:2.4vw;color:var(--mute)}
.line{display:flex;flex-wrap:wrap;gap:1vw;justify-content:center;max-width:84vw}
.ln{display:flex;align-items:center;gap:.6vw;background:var(--coal2);border:2px solid var(--line);border-radius:999px;padding:.3vw 1vw .3vw .3vw;font-size:1.4vw}
.ln em{font-style:normal;font-size:1vw;color:var(--mute)}.ln.over{opacity:.45}.ln.win{border-color:var(--gold)}.ln.win em{color:var(--gold2);font-weight:700}
/* número secreto */
.secret{font-family:var(--disp);font-size:16vh;font-weight:800;color:var(--gold2);line-height:1}
.nrows{display:grid;grid-template-columns:repeat(2,1fr);gap:1vh 2vw;width:70vw}
.nr{display:flex;align-items:center;gap:.8vw;background:var(--coal2);border-radius:999px;padding:.4vw 1.2vw .4vw .4vw;font-size:1.3vw;text-align:left}.nr b{flex:1}.nr span{color:var(--mute)}
.nr em{font-style:normal;color:var(--ok);font-weight:700}.nr.found{box-shadow:inset 0 0 0 2px var(--ok)}
/* reflejos */
.lamp{width:34vh;height:34vh;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:6vh;font-weight:800;background:#2a2430;box-shadow:inset 0 0 0 1.2vh #0005;transition:background .05s}
.lamp.wait{background:#3a3140;color:var(--mute)}.lamp.go{background:var(--ok);color:#0c120e;box-shadow:0 0 12vh var(--ok)}.lamp.fake{background:var(--ko);color:#fff;box-shadow:0 0 12vh var(--ko)}
.rx-res{display:flex;flex-direction:column;gap:1vh;width:44vw}
.rx{display:flex;align-items:center;gap:1vw;background:var(--coal2);border-radius:999px;padding:.4vw 1.4vw .4vw .4vw;font-size:1.5vw;animation:rise .4s both}.rx b{flex:1;text-align:left}.rx em{font-style:normal;color:var(--gold2);font-weight:700}
.rx.first{box-shadow:inset 0 0 0 3px var(--gold)}
/* botón prohibido */
.tgt{display:flex;align-items:center;gap:1vw;font-size:2vw;background:var(--coal2);padding:1vh 2vw;border-radius:999px}.tgt b{color:var(--gold2)}
.shape{height:44vh;display:grid;place-items:center}.shape svg{width:40vh;height:40vh;animation:pop .2s both}
/* último en pie */
.cmd{font-family:var(--disp);font-size:9vw;font-weight:800;padding:2vh 4vw;border-radius:2vw;min-width:40vw;background:var(--coal3)}
.cmd.g{background:var(--ok);color:#0c120e}.cmd.r{background:var(--ko);color:#fff}
.lives{display:flex;flex-wrap:wrap;gap:1vw;justify-content:center}
.lv{display:flex;align-items:center;gap:.4vw;background:var(--coal2);border-radius:999px;padding:.3vw .8vw .3vw .3vw}.lv.out{opacity:.25}
.hearts i{font-style:normal;color:#4a3f4d;font-size:1.2em}.hearts i.on{color:var(--ko)}
/* memoria */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:2vh;width:52vh}
.pad{aspect-ratio:1;border-radius:3vh;background:var(--pc);opacity:.28;border:0;transition:opacity .08s,transform .08s}
.pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 8vh var(--pc)}
.seqrow{display:flex;gap:1vw}.seqrow i{width:5vw;height:5vw;border-radius:1vw}
/* qué ha cambiado */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vh}.cgrid.c12{grid-template-columns:repeat(4,1fr)}
.cell{width:16vh;height:16vh;display:grid;place-items:center;font-size:10vh;background:var(--coal2);border-radius:2vh;border:0}
.cell.hit{box-shadow:0 0 0 .8vh var(--gold);animation:pulse .6s infinite alternate}
/* torneo */
.duels{display:grid;grid-template-columns:repeat(2,1fr);gap:1.6vh 3vw;width:84vw}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1vw;background:var(--coal2);border-radius:1.4vw;padding:1vh 1vw;position:relative}
.duel>i{font-style:normal;color:var(--mute);font-family:var(--disp);font-size:1.6vw}
.dp{display:flex;align-items:center;gap:.6vw;font-size:1.3vw}.dp:last-of-type{justify-content:flex-end}
.dp .hand{font-size:3vw}.dp.l{opacity:.3}.dp.w b{color:var(--gold2)}
.duel em{position:absolute;bottom:-1.2vh;left:50%;transform:translateX(-50%);font-style:normal;font-size:.9vw;background:var(--wine2);padding:.1em .6em;border-radius:999px;white-space:nowrap}
/* orden */
.ord{display:flex;gap:1.4vw}.oc{background:var(--coal2);border:2px solid var(--line);border-radius:1.2vw;padding:2.4vh 1.6vw;font-size:1.9vw;font-weight:700;min-width:14vw;position:relative}
.ord.sol .oc{border-color:var(--gold)}.oc i{position:absolute;top:-1.6vh;left:50%;transform:translateX(-50%);font-style:normal;background:var(--gold);color:var(--coal);border-radius:50%;width:3.2vh;height:3.2vh;display:grid;place-items:center;font-size:1.8vh}
/* bomba */
.bomb{position:relative;width:38vh;height:38vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a4d60,#1b161e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2vh 6vh #0008;animation:shake 0.5s infinite}
@keyframes shake{25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
.bcat{font-size:2.6vh;color:var(--gold2);font-weight:700;max-width:80%}.blet{font-family:var(--disp);font-size:16vh;font-weight:800;line-height:1}
.fuse{position:absolute;top:-4vh;left:50%;width:30vh;height:1vh;transform:translateX(-10%) rotate(-18deg);background:#5a4d60;border-radius:1vh;overflow:hidden}.fuse i{display:block;height:100%;background:linear-gradient(90deg,#c98a3b,#ffdd7a);transform-origin:left}
.boom{font-family:var(--disp);font-size:8vw;font-weight:800;color:var(--ko);animation:stamp .4s both}
.words{display:flex;flex-wrap:wrap;gap:1vw;justify-content:center;max-width:84vw}
.wd{display:flex;align-items:center;gap:.6vw;background:var(--coal2);border:2px solid var(--ok);border-radius:999px;padding:.3vw 1vw .3vw .3vw;font-size:1.6vw}
.wd em{font-style:normal;font-size:1vw;color:var(--mute)}.wd.unk{border-color:var(--gold)}.wd.rep{border-color:var(--line);opacity:.7}
/* dibujo */
.easel{font-size:16vh;animation:bob 1.4s infinite}
.gq.dibu{display:grid;grid-template-columns:auto 36vw;justify-content:center;align-items:center;gap:2vh 3vw}.gq.dibu .rtag{grid-column:1/-1}
.canvasbox{width:56vh;height:56vh;background:#f5efe3;border-radius:2vh;box-shadow:0 2vh 5vh #0008;overflow:hidden}
.drw{width:100%;height:100%}.drw polyline{fill:none;stroke:#1b1720;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.drw circle{fill:#1b1720}
.side{display:flex;flex-direction:column;gap:2vh;align-items:center}.side .opts{width:36vw;grid-template-columns:1fr}
/* infiltrado */
.clues{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vh 1.2vw;width:84vw}
.clue{display:flex;align-items:center;gap:1vw;background:var(--coal2);border-radius:1.2vw;padding:1vh 1.2vw;text-align:left}.clue .cw{flex:1;min-width:0;display:flex;flex-direction:column}
.clue .av{width:3.4vw;height:3.4vw;font-size:2vw}.clue b{font-size:1.1vw;color:var(--mute);font-weight:600}.clue span{font-family:var(--disp);font-size:2.4vw;font-weight:700;overflow:hidden;text-overflow:ellipsis}.clue em{font-style:normal;font-family:var(--disp);font-size:2.8vw;color:var(--gold2)}
.clue.inf{box-shadow:inset 0 0 0 3px var(--ko)}

/* resultados de la prueba */
.res{display:grid;grid-template-columns:1fr 1.2fr;gap:4vw;width:100%;align-items:center}
.rhead{grid-column:1/-1;text-align:center;font-family:var(--disp);font-size:2.4vw;color:var(--mute)}
.winner{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2vw;text-align:center}
.wp{display:flex;flex-direction:column;align-items:center;gap:1vh}
.wp .av.xxl{width:22vh;height:22vh;font-size:14vh;box-shadow:0 0 0 1vh var(--gold),0 0 10vh #d6a84e88}
.wp b{font-family:var(--disp);font-size:4.4vw}
.wl{width:100%;font-size:1.8vw;color:var(--gold2)}
.rrows{display:flex;flex-direction:column;gap:.8vh}
.rrow{display:grid;grid-template-columns:3vw auto 1fr auto 6vw 5vw;align-items:center;gap:1vw;background:var(--coal2);border-radius:999px;padding:.4vw 1.2vw .4vw .4vw;font-size:1.3vw}
.rrow:nth-child(2){animation-delay:.08s}.rrow:nth-child(3){animation-delay:.16s}.rrow:nth-child(4){animation-delay:.24s}.rrow:nth-child(n+5){animation-delay:.32s}
.rrow .pl{font-family:var(--disp);font-size:1.8vw;text-align:center;color:var(--mute)}.rrow.first{box-shadow:inset 0 0 0 3px var(--gold)}.rrow.first .pl{color:var(--gold2)}
.rrow .ln{font-size:1vw;color:var(--mute);background:none;border:0;padding:0}
.rrow em{font-style:normal;font-weight:800;text-align:right}.rrow .pts{color:var(--gold2)}.rrow .fch{color:var(--cream)}
/* clasificación */
.rank{width:74vw}.rank h2{font-family:var(--disp);font-size:3.6vw;font-weight:600;margin:0 0 2vh;text-align:center;color:var(--gold2)}
.rlist{display:flex;flex-direction:column;gap:.7vh}
.rk{display:grid;grid-template-columns:3vw 3.4vw auto 12vw 1fr 6vw 5vw;align-items:center;gap:1vw;background:var(--coal2);border-radius:999px;padding:.35vw 1.4vw .35vw .6vw;font-size:1.4vw;}
.rk:first-child{background:linear-gradient(90deg,#33290f,var(--coal2));box-shadow:inset 0 0 0 1px var(--gold)}
@keyframes slide{from{opacity:0;transform:translateX(-4vw)}}
.pos{font-family:var(--disp);font-size:2vw;text-align:center;font-weight:800}
.mv{font-size:1vw;color:var(--dim);text-align:center}.mv.up{color:var(--ok)}.mv.down{color:var(--ko)}
.rb{height:1.4vh;background:var(--coal3);border-radius:999px;overflow:hidden}.rb i{display:block;height:100%;background:linear-gradient(90deg,var(--wine2),var(--gold));animation:grow 1.2s .4s both;transform-origin:left}
.rk em{font-style:normal;font-weight:800;text-align:right}.rk .pts{color:var(--gold2);font-family:var(--disp);font-size:2vw}
.next{text-align:center;color:var(--mute);font-size:1.3vw;margin-top:2vh}
/* final */
.final{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;gap:2vh 3vw;width:100%;height:100%;align-items:center}
.champ{grid-column:1;grid-row:1/3;text-align:center}
.crownbig{font-size:10vh;animation:bob 1.4s infinite}
.champ .av.xxl{width:24vh;height:24vh;font-size:15vh;box-shadow:0 0 0 1.2vh var(--gold),0 0 14vh #d6a84eaa;animation:pop 1s .4s cubic-bezier(.2,1.6,.4,1) both}
.champ h1{font-family:var(--disp);font-size:6vw;margin:1vh 0 0;line-height:1}.champ p{font-size:1.5vw;color:var(--gold2);margin:0}
.podium{grid-column:2;display:flex;align-items:flex-end;justify-content:center;gap:1vw;height:34vh}
.pod{display:flex;flex-direction:column;align-items:center;gap:.6vh;width:10vw;font-size:1.2vw}.pod span{color:var(--mute)}
.pod .step{width:100%;background:linear-gradient(180deg,var(--gold),#8f6620);border-radius:1vw 1vw 0 0;display:grid;place-items:center;font-family:var(--disp);font-size:4vw;font-weight:800;color:var(--coal);animation:up 1s both}
.pod.p1 .step{height:20vh}.pod.p2 .step{height:14vh;background:linear-gradient(180deg,#cfd4d9,#7d858c)}.pod.p3 .step{height:10vh;background:linear-gradient(180deg,#d39a6a,#7c4e2b)}
@keyframes up{from{transform:scaleY(0);transform-origin:bottom}}
.fside{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:2vw;align-self:start}
.ftab{display:flex;flex-direction:column;gap:.4vh;max-height:36vh;overflow:hidden}
.frow{display:grid;grid-template-columns:2vw auto 1fr auto auto;align-items:center;gap:.6vw;font-size:1.05vw;background:var(--coal2);border-radius:999px;padding:.2vw .8vw .2vw .4vw}.frow em{font-style:normal;color:var(--gold2)}.frow .fch{color:var(--cream)}
.fstats{display:flex;flex-direction:column;gap:1vh}.fst{background:var(--coal2);border-radius:1vw;padding:.8vh 1vw;font-size:1vw}.fst>.fl{display:block;color:var(--mute)}.fst em{font-style:normal;color:var(--gold2)}.fst .pchip{font-size:1vw}
.again{grid-column:1/-1;text-align:center}.again .btn{font-size:1.4vw}

/* pausa y barra del anfitrión */
#pauseov{position:fixed;inset:0;z-index:20;background:#0e1311f5;display:none;place-items:center;text-align:center}
#pauseov.on{display:grid}#pauseov .pt{display:block;font-family:var(--disp);font-size:14vh;margin-top:3vh}#pauseov .ps{display:block;color:var(--mute);font-size:1.4vw}
#hostbar{position:fixed;right:1.4vw;bottom:1.4vh;z-index:45;display:flex;gap:.5vw;opacity:0;transition:opacity .3s;pointer-events:none}
.mouse #hostbar{opacity:1;pointer-events:auto}
#hostbar[data-phase=lobby] #pausebtn,#hostbar[data-phase=lobby] [data-host=skip],#hostbar[data-phase=lobby] [data-host=end]{display:none}
.hb{background:var(--coal2);border:1px solid var(--line);border-radius:999px;padding:.5em 1em;font-size:13px;display:flex;align-items:center;gap:.5em;color:var(--cream)}
.hb input{width:90px}
#tvstart{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 30%,#1b201e,var(--coal) 70%);display:grid;place-items:center;text-align:center}
#tvstart .btn{margin-top:6vh;font-size:1.8vw;padding:2vh 3vw}#tvstart .logo{flex-direction:column}#tvstart p{color:var(--mute);font-size:1.2vw}

/* ================= EL MÓVIL ================= */

.phh-s{display:flex;align-items:center;gap:10px}.phh-s span{display:flex;align-items:baseline;gap:4px;font-size:13px;color:var(--mute)}.phh-s b{font-family:var(--disp);font-size:26px;color:var(--cream)}
.phh-s .pts b{color:var(--gold2)}
.menub{background:var(--coal3);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:22px}
main{flex:1;display:flex;flex-direction:column}
.pc{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:16px}.pc.center{align-items:center;justify-content:center;text-align:center}

.hostbox{width:100%;background:var(--coal2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px;text-align:left}.hostbox h3{margin:0 0 10px;font-family:var(--disp);font-size:24px}
.lens.sm{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0}.lens.sm .lenb{padding:10px;border-radius:12px}.lens.sm .lenb b{font-size:20px}.lens.sm .lenb span{font-size:12px}
.gtitle{display:flex;align-items:center;gap:12px}.gtitle .gi{font-size:48px}.gtitle small{color:var(--mute);display:block}.gtitle b{font-family:var(--disp);font-size:30px;line-height:1}
.x2band{background:var(--gold2);color:var(--coal);font-weight:800;text-align:center;padding:8px;border-radius:10px}
.prules{margin:0;padding-left:22px;font-size:17px;line-height:1.45}.prules li{margin-bottom:6px}
.readyok{text-align:center;color:var(--ok);font-weight:700;padding:14px}
.dblon{text-align:center;color:var(--gold2);font-weight:700}
.pcount{font-family:var(--disp);font-size:42vw;font-weight:800;color:var(--gold2);line-height:1;animation:zoom 1s infinite}
.pplace{font-family:var(--disp);font-size:120px;font-weight:800;line-height:1}.pplace.gold{color:var(--gold2)}
.big{font-size:20px;font-weight:700;margin:0}
.gain{display:flex;gap:18px;font-family:var(--disp);font-size:34px;color:var(--gold2)}
.phw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:40vh}.phw-t{font-family:var(--disp);font-size:40px;font-weight:800}.phw p{color:var(--mute);margin:0}
.hmenu{position:fixed;inset:0;background:#000a;z-index:30;display:grid;place-items:end center}.hm-in{background:var(--coal2);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;text-align:center}.hm-in h3{margin:0 0 6px;font-family:var(--disp);font-size:26px}
/* mando: piezas de juego */
.pq{font-size:20px;font-weight:700;margin:0;line-height:1.3}.pnote{color:var(--mute);margin:0}
.pbtns{display:grid;grid-template-columns:1fr;gap:10px;flex:1;align-content:stretch}
.pbtns.n2,.pbtns.n3{grid-auto-rows:1fr}
.gb.ob{display:flex;align-items:center;gap:12px;background:var(--oc);border:1px solid #fff3;border-radius:10px;padding:18px;font-size:20px;font-weight:800;color:#fff;text-align:left;box-shadow:0 5px 0 #0007;min-height:70px}
.gb.ob i{font-style:normal;font-family:var(--disp);background:#0003;border-radius:8px;padding:2px 10px;font-size:22px}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gb.pp{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--coal2);border:2px solid var(--line);border-radius:16px;padding:10px 4px;font-size:14px}
.gb.pp small{color:var(--gold2);font-size:13px}
.kp{display:flex;flex-direction:column;gap:10px}
.kp-v{font-family:var(--disp);font-size:52px;text-align:center;background:var(--coal2);border-radius:14px;padding:6px;min-height:76px}.kp-v .ph{color:var(--dim);font-size:28px}

.kb.ok{background:var(--gold);color:var(--coal)}.kb.ok:disabled{opacity:.3}.kb.del{font-size:26px}
.nhist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.nhist span{background:var(--coal2);border-radius:999px;padding:4px 10px;font-size:14px}.nhist .up{color:var(--ok)}.nhist .down{color:var(--ko)}
.tapzone{flex:1;min-height:58vh;border-radius:28px;display:grid;place-items:center;font-family:var(--disp);font-size:56px;font-weight:800;text-align:center;touch-action:none}

.tapzone.cmd{min-width:0;padding:0}
.tgt.sm{font-size:15px;justify-content:center;padding:6px 14px}
.phl{text-align:center;font-size:30px}
.pads .pad{opacity:.85}
main .pads{width:100%;gap:12px}main .pad{border-radius:22px}main .pad.lit{opacity:1}
.mprog{display:flex;gap:8px;justify-content:center}.mprog i{width:30px;height:30px;border-radius:8px;background:var(--coal3)}
main .cgrid{gap:8px}main .cell{width:auto;height:auto;aspect-ratio:1;font-size:44px}
.olist{display:flex;flex-direction:column;gap:10px}
.oi{display:flex;align-items:center;gap:12px;background:var(--coal2);border:2px solid var(--line);border-radius:14px;padding:16px;font-size:18px;font-weight:700;text-align:left}

.bigL{font-family:var(--disp);font-size:40px;color:var(--gold2)}
.dword{background:var(--cream);color:var(--coal);border-radius:14px;padding:12px;text-align:center;font-size:16px}.dword b{display:block;font-family:var(--disp);font-size:36px}.dword span{font-size:12px;color:#6b5f66}.dword.sm b{font-size:24px}
.cv{width:100%;aspect-ratio:1;border-radius:16px;touch-action:none;background:#f5efe3}
.canvasbox.sm{width:100%;height:auto;aspect-ratio:1;max-height:42vh;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function morph(el, html){
  const keep = {};
  el.querySelectorAll('input,select,textarea').forEach(i => { if (i.id) keep[i.id] = i.type === 'checkbox' ? i.checked : i.value; });
  const act = document.activeElement, fid = act && el.contains(act) ? act.id : null;
  let sel = null; try { if (fid && act.selectionStart != null) sel = [act.selectionStart, act.selectionEnd]; } catch {}
  const sc = {}; el.querySelectorAll('[data-keepscroll]').forEach(x => sc[x.dataset.keepscroll] = x.scrollTop);
  const top = window.scrollY;
  el.innerHTML = html;
  for (const id in keep){
    const i = el.querySelector('#' + CSS.escape(id));
    if (!i || i.hasAttribute('data-fresh')) continue;
    if (i.type === 'checkbox') i.checked = keep[id];
    else if (i.tagName === 'SELECT'){ if ([...i.options].some(o => o.value === keep[id])) i.value = keep[id]; }
    else i.value = keep[id];
  }
  el.querySelectorAll('[data-keepscroll]').forEach(x => { if (sc[x.dataset.keepscroll] != null) x.scrollTop = sc[x.dataset.keepscroll]; });
  if (fid){ const i = document.getElementById(fid); if (i){ i.focus({preventScroll:true}); if (sel) try { i.setSelectionRange(sel[0], sel[1]); } catch {} } }
  window.scrollTo(0, top);
}

// Enlaces: r = sala, m = local, c = configuración, d = clave del director, t = token de jugador

  if (p.get('m') === 'local') return {mode: 'local', room, dk: p.get('d') || null};
  let cfg = PRESET_SUPA; const c = p.get('c'); if (c) try { cfg = JSON.parse(b64d(c)); } catch {}
  return {mode: 'supa', room, cfg, dk: p.get('d') || null};
}
function linkFor(view, ctx, extra = {}){
  const q = new URLSearchParams(); q.set('r', ctx.room);
  if (ctx.mode === 'local') q.set('m', 'local'); else if (ctx.cfg && ctx.cfg.url !== PRESET_SUPA.url) q.set('c', b64e(JSON.stringify(ctx.cfg)));
  for (const k in extra) q.set(k, extra[k]);
  return baseURL() + '#' + view + '?' + q.toString();
}

// ---------- selección equilibrada de pruebas ----------
function buildPlan(S, n){
  const np = pidsAll(S).length;
  const tele = S.tele !== false;
  // «Más tele, menos móvil»: fuera los juegos de mirar solo el móvil
  const ok = Object.values(GAMES).filter(g => !g.hidden && np >= (g.min || 2) && !(tele && SOLO_PHONE.includes(g.k)));
  const fin = ok.find(g => g.final);
  const pool = shuffle(ok.filter(g => !g.final));
  n = Math.max(1, Math.min(n, pool.length + (fin ? 1 : 0)));
  const want = fin && n >= 5 ? n - 1 : n;
  const plan = []; const perCat = {}; const maxCat = Math.max(1, Math.ceil(want / 4));
  // primero, sin repetir categoría seguida ni pasarse de una categoría
  for (let pass = 0; pass < 3 && plan.length < want; pass++){
    for (const g of pool){
      if (plan.length >= want) break; if (plan.includes(g.k)) continue;
      const prev = plan.length ? GAMES[plan[plan.length - 1]].cat : null;
      if (pass < 2 && g.cat === prev) continue;
      if (pass < 1 && (perCat[g.cat] || 0) >= maxCat) continue;
      plan.push(g.k); perCat[g.cat] = (perCat[g.cat] || 0) + 1;
    }
  }
  // si aún hay dos seguidas iguales, intenta intercambiar
  for (let i = 1; i < plan.length; i++) if (GAMES[plan[i]].cat === GAMES[plan[i - 1]].cat){ for (let j = i + 1; j < plan.length; j++){ if (GAMES[plan[j]].cat !== GAMES[plan[i - 1]].cat && (j + 1 >= plan.length || GAMES[plan[j + 1]].cat !== GAMES[plan[i]].cat)){ [plan[i], plan[j]] = [plan[j], plan[i]]; break; } } }
  // los que obligan a mirar mucho el móvil: como mucho 1 de cada 4 y nunca seguidos
  if (tele){ const heavy = k => PHONE_HEAVY.includes(k); const maxH = Math.max(1, Math.floor(want / 4)); let nh = 0;
    for (let i = 0; i < plan.length; i++) if (heavy(plan[i])){ nh++; if (nh > maxH || (i && heavy(plan[i - 1]))){ const alt = pool.find(g => !plan.includes(g.k) && !heavy(g.k) && g.cat !== (i ? GAMES[plan[i - 1]].cat : '')); if (alt){ plan[i] = alt.k; nh--; } } } }
  if (fin && n >= 5) plan.push(fin.k);
  return plan;
}

  if (S.gm === 'lobos') S.plan = ['lobos'];
  else { const base = buildPlan(S, n); S.plan = base;

  S.gi = -1; S.hist = []; S.gres = null; S.award = null; S.prevRank = rankOrder(S);
  pidsAll(S).forEach(pid => { const p = S.players[pid]; p.pts = 0; p.fichas = S.gm === 'casino' ? 10 : 5; p.dblUsed = false; p.wins = 0; p.stats = {}; });

function nextGame(S){
  S.gi++; if (S.gi >= S.plan.length) return finish(S);
  const def = GAMES[S.plan[S.gi]]; S.ready = {}; S.dbl = {}; S.fx = {}; S.rulesGo = false;

const barH = (from, ends) => `<div class="tbar"><i data-from="${from}" data-ends="${ends}"></i></div>`;
const gbtn = (obj, inner, cls = '', extra = '') => `<button class="gb ${cls}" data-g='${esc(JSON.stringify(obj))}' ${extra}>${inner}</button>`;
const waitPh = (t, sub = '') => `<div class="phw"><div class="phw-t">${t}</div>${sub ? `<p>${sub}</p>` : ''}</div>`;
const roundTag = (gp) => gp.n > 1 ? `<div class="rtag">Ronda ${gp.r + 1} de ${gp.n}</div>` : '';
const answeredRow = (P, map) => `<div class="arow">${P.players.map(p => `<span class="adot ${map && map.includes(p.pid) ? 'on' : ''}">${avH(p)}</span>`).join('')}</div>`;

// ---------- rondas genéricas: pregunta → revelación ----------
function rInit(g, rounds, qms, rms){ g.rounds = rounds; g.n = rounds.length; g.r = 0; g.st = 'wait'; g.qms = qms; g.rms = rms; g.ans = rounds.map(() => ({})); }
function rStart(g, v){ g.st = 'q'; g.t0 = v; g.t1 = v + (typeof g.qms === 'function' ? g.qms(g) : g.qms); }
function rStep(S, g, v, reveal){
  if (g.st === 'q'){ if (v >= g.t1 || (v - g.t0 > 1200 && allIn(S, g.ans[g.r]))){ g.st = 'rev'; g.t0 = v; g.t1 = v + g.rms; if (reveal) reveal(S, g); } return false; }
  if (g.st === 'rev' && v >= g.t1){ g.r++; if (g.r >= g.n) return true; rStart(g, v); }
  return false;
}
const rPub = g => ({r: g.r, n: g.n, st: g.st, t0: g.t0, t1: g.t1, done: Object.keys(g.ans[g.r] || {})});
const sumRaw = (S, g, f) => { const raw = {}; pidsAll(S).forEach(pid => { let t = null; g.ans.forEach((a, i) => { if (a[pid] != null){ t = (t || 0) + (f(a[pid], i, pid) || 0); } }); raw[pid] = t; }); return raw; };

// opciones de colores para preguntas (tele y móvil)
const tvOpts = (opts, st, correct, picks, P) => `<div class="opts n${opts.length}">${opts.map((o, i) => `<div class="opt ${st === 'rev' ? (correct === i || (Array.isArray(correct) && correct.includes(i)) ? 'win' : 'lose') : ''}" style="--oc:${OPTC[i % 6]}"><i>${OPTL[i]}</i><span>${esc(o)}</span>${st === 'rev' && picks ? `<div class="opick">${Object.entries(picks).filter(([, a]) => a === i).map(([pid]) => avH(pOf(P, pid), 'sm')).join('')}</div>` : ''}</div>`).join('')}</div>`;
// En el móvil solo hay botones de colores: las respuestas se leen en la tele, como en un concurso
const phOpts = (opts, mine, act, extra = {}) => `<p class="lookup">👀 Mira la tele y pulsa tu respuesta</p><div class="pbtns buzz n${opts.length}">${opts.map((o, i) => gbtn(Object.assign({a: act, i}, extra), `<b>${OPTL[i]}</b>`, `ob ${mine === i ? 'sel' : ''} ${mine != null && mine !== i ? 'dim' : ''}`, `style="--oc:${OPTC[i % 6]}" aria-label="Opción ${OPTL[i]}" ${mine != null ? 'disabled' : ''}`)).join('')}</div>`;
const phVerdict = (ok, txt) => `<div class="verd ${ok ? 'ok' : 'ko'}"><b>${ok ? '¡Bien!' : 'Fallo'}</b><span>${txt || ''}</span></div>`;

// ---------- teclado numérico propio (más cómodo que el del móvil) ----------
function keypad(id, label, max = 7){ const buf = (PH.gs[id] || ''); return `<div class="kp"><div class="kp-v">${buf ? esc(Number(buf).toLocaleString('es-ES')) : `<span class="ph">${label}</span>`}</div><div class="kp-g">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="kb" data-kp="${id}" data-k="${n}" data-max="${max}">${n}</button>`).join('')}<button class="kb del" data-kp="${id}" data-k="del">⌫</button><button class="kb" data-kp="${id}" data-k="0" data-max="${max}">0</button><button class="kb ok" data-kpsend="${id}" ${buf ? '' : 'disabled'}>OK</button></div></div>`; }

def('trivial', {name: 'El Gran Trivial', cat: 'Conocimiento', icon: '❓', desc: 'Preguntas rápidas. Acertar suma; acertar rápido suma más.',
  rules: ['Lee la pregunta en la tele.', 'Pulsa la respuesta en tu móvil.', 'Cuanto antes aciertes, más puntos.'], ctl: 'Cuatro botones de colores',
  init(S){ const g = {}; rInit(g, shuffle(TRIVIA).slice(0, 5).map(t => { const o = shuffle(t.slice(1)); return {q: t[0], o, c: o.indexOf(t[1])}; }), 12000, 3800); return g; },
  start(S, g, v){ rStart(g, v); },
  step(S, g, v){ return rStep(S, g, v); },
  act(S, g, pid, a, v){ if (a.a !== 'ans' || g.st !== 'q' || g.ans[g.r][pid] != null) return false; g.ans[g.r][pid] = {i: +a.i, ms: v - g.t0}; },
  result(S, g){ return {raw: sumRaw(S, g, (x, i) => x.i === g.rounds[i].c ? 100 + Math.round(100 * Math.max(0, 1 - x.ms / g.qms)) : 0)}; },
  pub(S, g){ const R = g.rounds[g.r]; return Object.assign(rPub(g), {q: R.q, o: R.o, c: g.st === 'rev' ? R.c : null, picks: g.st === 'rev' ? Object.fromEntries(Object.entries(g.ans[g.r]).map(([k, x]) => [k, x.i])) : null}); },
  me(S, g, pid){ const x = g.ans[g.r][pid]; return {mine: x ? x.i : null}; },
  tv(P, gp){ return `<div class="gq">${roundTag(gp)}<h2 class="q">${esc(gp.q)}</h2>${tvOpts(gp.o, gp.st, gp.c, gp.picks, P)}${gp.st === 'q' ? barH(gp.t0, gp.t1) + answeredRow(P, gp.done) : ''}</div>`; },
  ph(P, gp, M){ if (gp.st === 'rev') return phVerdict(M.mine === gp.c, M.mine == null ? 'No respondiste' : 'Era la ' + OPTL[gp.c]); return phOpts(gp.o, M.mine, 'ans'); },
  bot(S, g, pid, v){ if (g.st === 'q' && g.ans[g.r][pid] == null && v - g.t0 > 1500 + Math.random() * 6000) this.act(S, g, pid, {a: 'ans', i: Math.random() < .6 ? g.rounds[g.r].c : rnd(4)}, v); },
});

def('mentiroso', {name: 'La Ruleta del Mentiroso', cat: 'Apuestas', icon: '🎰', desc: '¿Verdad o mentira? Apuesta tus fichas si estás seguro.',
  rules: ['Lee la afirmación en la tele.', 'Elige cuántas fichas apuestas (de 0 a 3).', 'Pulsa VERDAD o MENTIRA. Si aciertas, ganas lo apostado; si fallas, lo pierdes.'], ctl: 'Fichas y dos botones',
  init(S){ const g = {}; rInit(g, shuffle(TRUTHS).slice(0, 4).map(t => ({q: t[0], v: t[1]})), 15000, 4800); return g; },
  start(S, g, v){ rStart(g, v); },
  step(S, g, v){ return rStep(S, g, v, (S, g) => Object.entries(g.ans[g.r]).forEach(([pid, x]) => { x.d = addFichas(S, pid, x.v === g.rounds[g.r].v ? x.bet : -x.bet); })); },
  act(S, g, pid, a, v){ if (a.a !== 'ans' || g.st !== 'q' || g.ans[g.r][pid] != null) return false; const bet = Math.max(0, Math.min(3, +a.bet || 0, S.players[pid].fichas)); g.ans[g.r][pid] = {v: !!a.v, bet, ms: v - g.t0}; },
  result(S, g){ return {raw: sumRaw(S, g, (x, i) => x.v === g.rounds[i].v ? 100 + Math.round(30 * Math.max(0, 1 - x.ms / g.qms)) : 0)}; },
  pub(S, g){ const R = g.rounds[g.r]; return Object.assign(rPub(g), {q: R.q, truth: g.st === 'rev' ? R.v : null, picks: g.st === 'rev' ? g.ans[g.r] : null}); },
  me(S, g, pid){ return {mine: g.ans[g.r][pid] || null}; },
  tv(P, gp){ const rev = gp.st === 'rev';

  ph(P, gp, M, me){ if (gp.st === 'rev'){ const x = M.mine; return x ? phVerdict(x.v === gp.truth, `Era ${gp.truth ? 'VERDAD' : 'MENTIRA'}. ${x.bet ? (x.v === gp.truth ? 'Ganas ' : 'Pierdes ') + x.bet + (x.bet === 1 ? ' ficha.' : ' fichas.') : ''}`) : phVerdict(false, 'No respondiste'); }
    if (M.mine) return waitPh('Apostado', `${M.mine.v ? 'VERDAD' : 'MENTIRA'} · ${M.mine.bet === 1 ? '1 ficha' : M.mine.bet + ' fichas'}`);
    const max = Math.min(3, me.fichas); const bet = Math.min(PH.gs.bet ?? 1, max);
    return `<p class="pq">${esc(gp.q)}</p><div class="betsel"><span>Apuesta</span>${[0, 1, 2, 3].map(n => `<button class="chipb ${bet === n ? 'on' : ''}" data-set="bet" data-v="${n}" ${n > max ? 'disabled' : ''}>${n}</button>`).join('')}</div><div class="pbtns n2">${gbtn({a: 'ans', v: true, bet}, '<span>VERDAD</span>', 'ob', 'style="--oc:#3d8f62"')}${gbtn({a: 'ans', v: false, bet}, '<span>MENTIRA</span>', 'ob', 'style="--oc:#a3324a"')}</div>`; },
  bot(S, g, pid, v){ if (g.st === 'q' && !g.ans[g.r][pid] && v - g.t0 > 2000 + Math.random() * 7000) this.act(S, g, pid, {a: 'ans', v: Math.random() < .6 ? g.rounds[g.r].v : Math.random() < .5, bet: rnd(4)}, v); },
});

def('mayoria', {name: 'La Mayoría Manda', cat: 'Social', icon: '🗳️', desc: 'No gana quien tiene razón: gana quien piensa como el grupo.',

def('dilema', {name: 'El Dilema', cat: 'Decisiones', icon: '⚖️', desc: 'Dos caminos. Lo que elijas tú depende de lo que elijan los demás.',
  rules: ['Cada ronda tiene su propia regla: léela en la tele.', 'Elige en el móvil.', 'Tu resultado depende también de lo que hagan los demás.'], ctl: 'Dos o tres botones',
  init(S){ const ks = shuffle(DILEMMAS); const seen = new Set(); const list = []; ks.forEach(d => { if (!seen.has(d.k) && list.length < 3){ seen.add(d.k); list.push(d); } }); const g = {}; rInit(g, list.map(d => Object.assign({}, d)), 15000, 6000); return g; },
  start(S, g, v){ rStart(g, v); },
  step(S, g, v){ return rStep(S, g, v, (S, g) => {
    const R = g.rounds[g.r], A = g.ans[g.r], ids = Object.keys(A), cnt = R.o.map((_, i) => ids.filter(p => A[p].i === i).length); R.cnt = cnt; R.gain = {}; let msg = '';
    if (R.k === 'minoria'){ const [a, b] = cnt; const win = a === b ? -1 : a < b ? 0 : 1; ids.forEach(p => R.gain[p] = win < 0 ? 40 : A[p].i === win ? 120 : 0); msg = win < 0 ? 'Empate: todos sacan un poco.' : `Gana la minoría: ${R.o[win]}.`; }
    if (R.k === 'robar'){ const st = cnt[1], lim = Math.max(1, Math.floor(ids.length / 3)); if (st === 0){ ids.forEach(p => R.gain[p] = 60); msg = 'Nadie ha robado: el bote se reparte.'; } else if (st <= lim){ ids.forEach(p => R.gain[p] = A[p].i === 1 ? 160 : 20); msg = 'Pocos ladrones: se llevan el bote.'; } else { ids.forEach(p => R.gain[p] = 0); msg = 'Demasiados ladrones: el bote se esfuma.'; } }
    if (R.k === 'riesgo'){ ids.forEach(p => { if (A[p].i === 0) R.gain[p] = 60; else { A[p].coin = Math.random() < .5; R.gain[p] = A[p].coin ? 180 : 0; } }); msg = 'La moneda ha decidido.'; }
    if (R.k === 'unanime'){ const m = Math.max(...cnt); if (m === ids.length && ids.length > 1){ ids.forEach(p => R.gain[p] = 150); msg = '¡Unanimidad! Todos ganan.'; } else { const w = cnt.indexOf(m); ids.forEach(p => R.gain[p] = A[p].i === w ? 50 : 0); msg = 'No hubo unanimidad. Solo suma la opción más votada.'; } }

  pub(S, g){ const R = g.rounds[g.r]; return Object.assign(rPub(g), {q: R.q, o: R.o, note: R.note, k: R.k, cnt: g.st === 'rev' ? R.cnt : null, msg: g.st === 'rev' ? R.msg : null, gain: g.st === 'rev' ? R.gain : null, picks: g.st === 'rev' ? g.ans[g.r] : null}); },
  me(S, g, pid){ return {mine: g.ans[g.r][pid] || null}; },
  tv(P, gp){ const rev = gp.st === 'rev';
    return `<div class="gq">${roundTag(gp)}<h2 class="q">${esc(gp.q)}</h2><p class="note">${esc(gp.note)}</p>${rev ? `<div class="dcols">${gp.o.map((o, i) => `<div class="dcol" style="--oc:${OPTC[i % 4]}"><h3>${esc(o)}</h3><b>${gp.cnt[i]}</b><div>${Object.entries(gp.picks).filter(([, x]) => x.i === i).map(([pid, x]) => chipH(pOf(P, pid), `<em class="${gp.gain[pid] ? 'up' : ''}">${gp.gain[pid] ? '+' + gp.gain[pid] : '0'}${x.coin != null ? (x.coin ? ' · cara' : ' · cruz') : ''}</em>`)).join('')}</div></div>`).join('')}</div><p class="msg">${esc(gp.msg)}</p>` : `${tvOpts(gp.o, 'q')}${barH(gp.t0, gp.t1)}${answeredRow(P, gp.done)}`}</div>`; },
  ph(P, gp, M){ if (gp.st === 'rev'){ const gn = M.mine ? (gp.gain[PH.me.pid] || 0) : 0; return phVerdict(gn > 0, (M.mine ? `+${gn}. ` : 'No elegiste. ') + gp.msg); } if (M.mine) return waitPh('Decidido', 'Has elegido ' + esc(gp.o[M.mine.i])); return phOpts(gp.o, null, 'ans'); },
  bot(S, g, pid, v){ if (g.st === 'q' && !g.ans[g.r][pid] && v - g.t0 > 2000 + Math.random() * 8000) this.act(S, g, pid, {a: 'ans', i: rnd(g.rounds[g.r].o.length)}); },

def('precio', {name: 'El Precio Justo', cat: 'Estimación', icon: '🏷️', desc: '¿Cuánto crees? Acércate todo lo que puedas… sin pasarte.',

def('infiltrado', {name: 'El Infiltrado', cat: 'Social', icon: '🕵️', desc: 'Todos tenéis la misma palabra… menos uno, que ni siquiera lo sabe.', min: 4,

def('caos', {name: 'El Caos Final', cat: 'Final', icon: '🌪️', final: true, desc: 'Preguntas y reflejos, cada vez más rápido. Vale el doble.',

  init(S){ const qs = shuffle(TRIVIA).slice(0, 3).map(t => { const o = shuffle(t.slice(1)); return {t: 'q', q: t[0], o, c: o.indexOf(t[1])}; });
    const steps = [Object.assign(qs[0], {ms: 9000}), {t: 'rx', go: 1500 + rnd(2000)}, Object.assign(qs[1], {ms: 7500}), {t: 'rx', go: 1300 + rnd(2200)}, Object.assign(qs[2], {ms: 6000})];
    const g = {}; rInit(g, steps, 0, 2600); g.qms = g2 => { const R = g2.rounds[g2.r]; return R.t === 'q' ? R.ms : R.t === 'rx' ? R.go + 1800 : 4000 + R.seq.length * 900; }; return g; },

  pub(S, g){ const R = g.rounds[g.r]; const b = {r: g.r, n: g.n, st: g.st, t0: g.t0, t1: g.t1, t: R.t, done: Object.keys(g.ans[g.r] || {})};

// Pruebas por turnos: uno actúa en el salón y el resto adivina desde el móvil
// Juegos por turnos «a gritos»: uno actúa, los demás gritan la respuesta y quien actúa
// marca en su móvil quién la ha acertado. Sale la siguiente al instante, hasta que acabe el tiempo.
function turnGame(k, o){ def(k, Object.assign({
  init(S){ const all = pidsAll(S); const ps = shuffle(all).slice(0, Math.min(all.length, o.maxTurns || 5)); const pool = shuffle(o.items());
    return {turns: ps.map(pid => ({pid, hits: [], skips: 0})), pool, pi: 0, t: 0, st: 'wait'}; },
  cur(g){ return g.pool[g.pi % g.pool.length]; },
  start(S, g, v){ this.pre(g, v); },
  pre(g, v){ g.st = 'pre'; g.t0 = v; g.t1 = v + 5000; },
  step(S, g, v){ const T = g.turns[g.t];
    if (g.st === 'pre' && v >= g.t1){ g.st = 'q'; g.t0 = v; g.t1 = v + o.ms; g.w0 = v; return false; }
    if (g.st === 'q' && (v >= g.t1)){ g.st = 'rev'; g.t0 = v; g.t1 = v + 6000; g.last = o.word(this.cur(g)); g.pi++; return false; }
    if (g.st === 'rev' && v >= g.t1){ g.t++; if (g.t >= g.turns.length) return true; this.pre(g, v); }
    return false; },
  act(S, g, pid, a, v){ const T = g.turns[g.t]; if (g.st !== 'q' || pid !== T.pid) return false;
    const w = o.word(this.cur(g));
    if (a.a === 'hit'){ if (!S.players[a.pid] || a.pid === T.pid) return false; T.hits.push({pid: a.pid, w, ms: v - g.w0}); }
    else if (a.a === 'pass' || a.a === 'foul'){ T.skips++; T.fouls = (T.fouls || 0) + (a.a === 'foul' ? 1 : 0); g.lastSkip = {w, foul: a.a === 'foul', at: v}; }
    else return false;
    g.pi++; g.w0 = v; },
  result(S, g){ const raw = {}; pidsAll(S).forEach(p => raw[p] = 0);
    g.turns.forEach(T => T.hits.forEach(h => { raw[h.pid] = (raw[h.pid] || 0) + 100 + Math.round(40 * Math.max(0, 1 - h.ms / 20000)); raw[T.pid] += 70; }));
    return {raw}; },
  pub(S, g){ const T = g.turns[g.t]; return {st: g.st, t0: g.t0, t1: g.t1, t: g.t, n: g.turns.length, actor: T.pid, hits: T.hits.map(h => ({pid: h.pid, w: h.w})), skips: T.skips, fouls: T.fouls || 0, last: g.st === 'rev' ? g.last : null, skip: g.lastSkip && g.lastSkip.at > (g.t0 - o.ms) ? g.lastSkip : null}; },
  me(S, g, pid){ const T = g.turns[g.t]; if (T.pid !== pid) return {actor: false}; const it = this.cur(g); return {actor: true, card: {w: o.word(it), ban: o.ban ? o.ban(it) : null}}; },
  tv(P, gp, v){ const A = pOf(P, gp.actor); const head = `<div class="rtag">Turno ${gp.t + 1} de ${gp.n}</div>`;
    const hits = gp.hits.length ? `<div class="hits">${gp.hits.map(h => `<div class="hit">${avH(pOf(P, h.pid), 'sm')}<b>${esc(h.w)}</b></div>`).join('')}</div>` : '';
    if (gp.st === 'pre') return `<div class="gq">${head}<div class="spot"><div class="spot-row"><div class="spot-p">${avH(A, 'xl')}<b>${esc(A.name)}</b></div></div><div class="spot-n">${o.tvPre}</div></div><p class="shout">🗣️ Los demás: ¡gritad la respuesta!</p><p class="note">${o.tvHow}</p></div>`;
    if (gp.st === 'q') return `<div class="gq">${head}<div class="actor">${avH(A, 'xl')}<div><b>${esc(A.name)}</b><span>${o.tvNow}</span></div></div><div class="hitcount"><b>${gp.hits.length}</b><span>${gp.hits.length === 1 ? 'acierto' : 'aciertos'}</span></div><p class="shout">🗣️ ¡Gritad la respuesta!</p>${barH(gp.t0, gp.t1)}${hits}</div>`;
    return `<div class="gq">${head}<div class="tag">¡Tiempo!</div><h2 class="q">${esc(A.name)}: ${gp.hits.length} ${gp.hits.length === 1 ? 'acierto' : 'aciertos'}</h2>${hits || '<p class="note">Nadie ha acertado ninguna.</p>'}<p class="note">La última era: <b>${esc(gp.last || '')}</b></p></div>`; },

def('respuesta', {name: 'La Respuesta Más Ingeniosa', cat: 'Social', icon: '💬', desc: 'Completa la frase en voz alta con lo más gracioso que se te ocurra. Vota la mejor.', min: 3,

    if (g.st === 'q'){ const on = pidsOn(S).filter(p => p !== C.pid); if (v >= g.t1 || (v - g.t0 > 1500 && on.every(p => g.votes[g.c][p]))){ const vs = Object.values(g.votes[g.c]); const cu = vs.filter(x => x === 'C').length, in_ = vs.length - cu; C.guilty = cu > in_; C.cu = cu; C.in = in_; g.st = 'rev'; g.t0 = v; g.t1 = v + 6500; } return false; }
    if (g.st === 'rev' && v >= g.t1){ g.c++; if (g.c >= g.cases.length) return true; this.def_(g, v); }
    return false; },
  act(S, g, pid, a){ if (a.a !== 'verdict' || g.st !== 'q') return false; const C = g.cases[g.c]; if (pid === C.pid || g.votes[g.c][pid]) return false; g.votes[g.c][pid] = a.v === 'C' ? 'C' : 'I'; return true; },
  skipDef(g, v){ if (g.st === 'def') g.t1 = v; },
  result(S, g){ const raw = {}; pidsAll(S).forEach(p => raw[p] = 0);
    g.cases.forEach((C, i) => { if (C.guilty == null) return; if (!C.guilty) raw[C.pid] += 200; const maj = C.guilty ? 'C' : 'I'; Object.entries(g.votes[i]).forEach(([p, x]) => { if (x === maj) raw[p] += 80; }); });
    const lines = {}; g.cases.forEach(C => { if (C.guilty != null) lines[C.pid] = C.guilty ? 'Declarado culpable' : 'Absuelto'; }); return {raw, lines}; },
  pub(S, g){ const C = g.cases[g.c]; return {st: g.st, t0: g.t0, t1: g.t1, c: g.c, n: g.cases.length, acc: C.pid, txt: C.txt, done: Object.keys(g.votes[g.c] || {}), guilty: g.st === 'rev' ? C.guilty : null, cu: g.st === 'rev' ? C.cu : null, inn: g.st === 'rev' ? C.in : null}; },
  me(S, g, pid){ return {mine: (g.votes[g.c] || {})[pid] || null}; },

  ph(P, gp, M, me){ const acc = gp.acc === me.pid;

  bot(S, g, pid, v){ if (g.st === 'q' && v - g.t0 > 1500 + Math.random() * 6000) this.act(S, g, pid, {a: 'verdict', v: Math.random() < .5 ? 'C' : 'I'}); },

def('memoria', {name: 'Memoria de Élite', cat: 'Memoria', icon: '🧠', desc: 'La tele enciende colores. Repite la secuencia. Cada ronda, uno más.',
  rules: ['Mira la tele: se encenderán colores en orden.', 'Después, repítelos en tu móvil.', 'Cada ronda la secuencia es más larga.'], ri: ['👀', '🟥🟦', '🧠'], ctl: 'Cuatro botones de colores',
  init(S){ const g = {}; rInit(g, [3, 4, 5, 6, 7].map(n => ({seq: Array.from({length: n}, () => rnd(4))})), 0, 2800); return g; },
  start(S, g, v){ this.show(g, v); },
  show(g, v){ g.st = 'show'; g.t0 = v; g.t1 = v + 700 + g.rounds[g.r].seq.length * 800 + 300; },
  step(S, g, v){ if (g.st === 'show' && v >= g.t1){ g.st = 'q'; g.t0 = v; g.t1 = v + 4000 + g.rounds[g.r].seq.length * 900; return false; }

  act(S, g, pid, a, v){ if (a.a !== 'seq' || g.st !== 'q' || +a.r !== g.r || g.ans[g.r][pid] != null || !Array.isArray(a.s)) return false; const seq = g.rounds[g.r].seq; g.ans[g.r][pid] = {ok: a.s.length === seq.length && a.s.every((x, i) => +x === seq[i]), ms: v - g.t0}; },

  pub(S, g){ const R = g.rounds[g.r]; return {r: g.r, n: g.n, st: g.st, t0: g.t0, t1: g.t1, len: R.seq.length, seq: g.st === 'q' ? null : R.seq, done: Object.keys(g.ans[g.r] || {}), res: g.st === 'rev' ? g.ans[g.r] : null}; },
  me(S, g, pid){ return {mine: g.ans[g.r][pid] || null}; },
  fast: true,
  litAt(gp, v){ if (gp.st !== 'show') return -1; const rel = v - gp.t0 - 700; if (rel < 0) return -1; const k = Math.floor(rel / 800); if (k >= gp.seq.length || rel % 800 > 600) return -1; return k; },

    if (gp.st === 'rev') return `<div class="gq">${roundTag(gp)}<div class="seqrow">${gp.seq.map(i => `<i style="background:${MEM_COLORS[i][1]}"></i>`).join('')}</div><div class="mini">${Object.entries(gp.res).map(([p, x]) => chipH(pOf(P, p), `<em class="${x.ok ? 'up' : 'down'}">${x.ok ? '✓' : '✗'}</em>`)).join('')}</div></div>`;

    if (gp.st === 'show') return waitPh('Mira la tele', `Memoriza ${gp.len} colores`); if (M.mine) return waitPh('Enviado', 'Espera a los demás');

});

  init(S){ const sched = []; let t = 2500, green = true; while (t < 50000){ const d = green ? 1400 + rnd(2600) : 1300 + rnd(1700); sched.push({g: green, at: t, d}); t += d; green = !green; } return {sched, pos: {}, fin: [], caught: {}, last: {}, st: 'wait', goal: 45}; },

// Carrera de Caballos: como en la feria, pero cada pregunta acertada es un paso
function horseQ(){ const t = rnd(5);
  if (t === 0){ const a = 3 + rnd(12), b = 2 + rnd(9); const r = a + b; const o = shuffle([r, r + 1, r - 1, r + 2]); return {q: `${a} + ${b}`, o: o.map(String), c: o.indexOf(r)}; }
  if (t === 1){ const x = pick(TRUTHS); return {q: x[0], o: ['Verdad', 'Mentira'], c: x[1] ? 0 : 1}; }
  if (t === 2){ const f = pick(FLAGS); const m = mkOpts(f[1], FLAGS.map(x => x[1])); return {q: f[0], big: true, o: m.o, c: m.c}; }
  if (t === 3){ const x = pick(COMPARE); return {q: x[0], o: [x[1], x[2]], c: x[3]}; }
  const tr = pick(TRIVIA); const m = mkOpts(tr[1], tr.slice(2)); return {q: tr[0], o: m.o, c: m.c}; }
def('caballos', {name: 'La Carrera de Caballos', cat: 'Rapidez', icon: '🏇', desc: 'Como en la feria: cada pregunta acertada, tu caballo avanza. Si fallas, retrocede.',
  rules: ['Las preguntas salen en la tele, rapidísimas, una tras otra. Las mismas para todos.', 'Pulsa el color de la respuesta. Acierto: tu caballo avanza. Fallo: retrocede.', 'Los tres primeros en cruzar la meta se llevan la gloria.'], ri: ['📺', '🏇', '🏁'], ctl: 'Botones de colores',
  init(S){ return {pos: {}, fin: [], st: 'wait', goal: 8, qk: 0, Q: null, ans: {}, last: null}; },
  start(S, g, v){ g.t0 = v; g.tEnd = v + 120000; pidsAll(S).forEach(p => { g.pos[p] = 0; }); this.ask(g, v); },
  ask(g, v){ g.Q = horseQ(); g.ans = {}; g.qk++; g.st = 'q'; g.q0 = v; g.q1 = v + 6500; },
  settle(S, g, v){ const res = {}; pidsAll(S).forEach(p => { if (g.fin.includes(p)) return; const a = g.ans[p]; if (!a) return; const ok = a.i === g.Q.c; g.pos[p] = Math.max(0, (g.pos[p] || 0) + (ok ? 1 : -1)); res[p] = ok; if (g.pos[p] >= g.goal) g.fin.push(p); });
    g.last = {res, c: g.Q.c}; g.st = 'show'; g.q0 = v; g.q1 = v + 1600; },
  step(S, g, v){ const racing = pidsAll(S).filter(p => !g.fin.includes(p));
    if (g.st === 'q' && (v >= g.q1 || (v - g.q0 > 800 && racing.filter(p => pidsOn(S).includes(p)).every(p => g.ans[p])))){ this.settle(S, g, v); return false; }
    if (g.st === 'show' && v >= g.q1){ if (v >= g.tEnd || g.fin.length >= Math.min(3, pidsAll(S).length) || !racing.length){ g.st = 'rev'; g.t1 = v + 6000; return false; } this.ask(g, v); return false; }
    return g.st === 'rev' && v >= g.t1; },
  act(S, g, pid, a, v){ if (a.a !== 'ans' || g.st !== 'q' || g.fin.includes(pid) || g.ans[pid] || +a.k !== g.qk) return false; g.ans[pid] = {i: +a.i}; return true; },
  result(S, g){ const raw = {}; pidsAll(S).forEach(p => { const i = g.fin.indexOf(p); raw[p] = i >= 0 ? 3000 - i * 400 : (g.pos[p] || 0) * 100; }); return {raw}; },
  pub(S, g){ return {st: g.st, t0: g.q0, t1: g.q1, pos: g.pos, fin: g.fin, goal: g.goal, k: g.qk, q: g.Q ? g.Q.q : '', big: g.Q && g.Q.big, o: g.Q ? g.Q.o : [], c: g.st === 'show' ? g.Q.c : null, done: Object.keys(g.ans), last: g.st === 'show' ? g.last : null}; },
  me(S, g, pid){ return {mine: g.ans[pid] ? g.ans[pid].i : null, pos: g.pos[pid] || 0, fin: g.fin.indexOf(pid), ok: g.st === 'show' && g.last ? g.last.res[pid] : null}; },
  tv(P, gp){ if (gp.st === 'rev') return `<div class="gq"><h2 class="q">¡Foto finish!</h2><div class="podline">${gp.fin.map((p, i) => `<div class="pp${i + 1}">${avH(pOf(P, p), 'lg')}<b>${i + 1}º ${esc(pOf(P, p).name)}</b></div>`).join('') || '<p class="note">Nadie ha cruzado la meta.</p>'}</div></div>`;
    const hip = `<div class="hippo sm">${P.players.map((p, i) => { const d = gp.pos[p.pid] || 0; const f = gp.fin.indexOf(p.pid); const r = gp.last ? gp.last.res[p.pid] : undefined; return `<div class="hl"><span class="hn">${i + 1}</span><div class="hrun"><span class="horse ${r === true ? 'go' : r === false ? 'trip' : ''}" style="left:${Math.round(d / gp.goal * 86)}%"><i>🏇</i>${avH(p, 'sm')}</span></div><span class="hfin">${f >= 0 ? f + 1 + 'º' : '🏁'}</span></div>`; }).join('')}</div>`;
    const opts = tvOpts(gp.o, gp.st === 'show' ? 'rev' : 'q', gp.c);
    return `<div class="gq horseq"><h2 class="q ${gp.big ? 'big' : ''}">${esc(gp.q)}</h2>${opts}${gp.st === 'q' ? barH(gp.t0, gp.t1) : '<div class="tbar"></div>'}${hip}</div>`; },
  ph(P, gp, M){ if (gp.st === 'rev') return phVerdict(M.fin >= 0, M.fin >= 0 ? `Cruzaste la meta el ${M.fin + 1}º` : 'Tu caballo se quedó en el paso ' + M.pos);
    if (M.fin >= 0) return waitPh('¡Meta!', `Has llegado el ${M.fin + 1}º`);
    if (gp.st === 'show') return M.ok == null ? lookTV('¡Siguiente pregunta!', '🏇 ' + M.pos + '/' + gp.goal) : `<div class="fb big ${M.ok ? 'ok' : 'ko'}">${M.ok ? '¡Galopa!' : '¡Tropiezo!'}</div>`;
    return `<div class="pprog horse"><i style="width:${Math.round(M.pos / gp.goal * 100)}%"></i><span>🏇 ${M.pos}/${gp.goal}</span></div>${phOpts(gp.o, M.mine, 'ans', {k: gp.k})}`; },
  bot(S, g, pid, v){ if (g.st !== 'q' || g.fin.includes(pid) || g.ans[pid] || v - g.q0 < 1200 + Math.random() * 3000) return; this.act(S, g, pid, {a: 'ans', k: g.qk, i: Math.random() < .65 ? g.Q.c : rnd(g.Q.o.length)}, v); },
});

def('simon', {name: 'Simón Dice', cat: 'Atención', icon: '🗣️', desc: 'Obedece solo si la orden empieza por «Simón dice». Si no, ni te muevas.',
  rules: ['La tele da órdenes: «Simón dice: toca el AZUL».', 'Obedece SOLO si empieza por «Simón dice». Si no, no toques nada.', 'Cada acierto suma. Las órdenes van cada vez más rápido.'], ri: ['🗣️', '🟦', '⚠️'], ctl: 'Cuatro colores',
  init(S){ const seq = []; let t = 2200; for (let i = 0; i < 14; i++){ const win = Math.max(1500, 3000 - i * 110); seq.push({s: i < 2 || Math.random() < .62, c: rnd(4), at: t, win}); t += win + 800; } return {seq, taps: {}, done: -1, ok: {}, st: 'wait'}; },
  start(S, g, v){ g.st = 'q'; g.t0 = v; pidsAll(S).forEach(p => g.ok[p] = 0); },
  step(S, g, v){ if (g.st === 'rev') return v >= g.t1; const rel = v - g.t0;
    for (let i = g.done + 1; i < g.seq.length; i++){ const it = g.seq[i]; if (rel < it.at + it.win + 500) break; g.done = i; pidsAll(S).forEach(p => { const t = (g.taps[p] || {})[i]; if ((it.s && t === it.c) || (!it.s && t == null)) g.ok[p]++; }); }
    if (g.done >= g.seq.length - 1){ g.st = 'rev'; g.t1 = v + 5000; } return false; },
  act(S, g, pid, a, v){ if (a.a !== 'tap' || g.st !== 'q') return false; const i = +a.i, it = g.seq[i]; if (!it || i <= g.done) return false; const rel = v - g.t0; if (rel < it.at - 300 || rel > it.at + it.win + 900) return false; const T = g.taps[pid] ||= {}; if (T[i] != null) return false; T[i] = +a.c; },
  result(S, g){ const raw = {}; pidsAll(S).forEach(p => raw[p] = (g.ok[p] || 0) * 100); return {raw}; },
  cur(gp, v){ const rel = v - gp.t0; return gp.seq.findIndex(it => rel >= it.at && rel < it.at + it.win); },
  pub(S, g){ return {st: g.st, t0: g.t0, seq: g.seq, ok: g.ok, done: g.done}; },
  me(S, g, pid){ return {taps: g.taps[pid] || {}}; },
  fast: true,
  cmd(it){ return `${it.s ? 'Simón dice: ' : ''}toca el ${MEM_COLORS[it.c][0].toUpperCase()}.`; },
  tv(P, gp, v){ if (gp.st === 'rev') return `<div class="gq"><div class="rx-res">${P.players.map(p => ({p, s: gp.ok[p.pid] || 0})).sort((a, b) => b.s - a.s).map(({p, s}, i) => `<div class="rx ${i === 0 ? 'first' : ''}">${avH(p, 'sm')}<b>${esc(p.name)}</b><em>${s} de ${gp.seq.length}</em></div>`).join('')}</div></div>`;
    const i = this.cur(gp, v), it = gp.seq[i]; if (it && TVS.simon !== i){ TVS.simon = i; say(this.cmd(it)); }
    return `<div class="gq"><div class="simon ${it ? (it.s ? 'yes' : 'no') : ''}">${it ? `${it.s ? '<small>Simón dice:</small>' : ''}toca el <b style="color:${MEM_COLORS[it.c][1]}">${MEM_COLORS[it.c][0].toUpperCase()}</b>` : 'Atentos…'}</div></div>`; },
  ph(P, gp, M, me, v){ if (gp.st === 'rev') return phVerdict((gp.ok[me.pid] || 0) >= gp.seq.length / 2, `${gp.ok[me.pid] || 0} de ${gp.seq.length} bien`);
    const i = this.cur(gp, v), it = gp.seq[i]; const done = i >= 0 && (M.taps[i] != null || PH.gs['s' + i] != null);
    return `<div class="simon-ph">${it ? (it.s ? '<small>Simón dice:</small>' : '') + 'toca el <b style="color:' + MEM_COLORS[it.c][1] + '">' + MEM_COLORS[it.c][0].toUpperCase() + '</b>' : 'Atento…'}</div><div class="pads ${done ? 'dim' : ''}">${MEM_COLORS.map((c, k) => `<button class="pad" data-pad="${k}" style="--pc:${c[1]}"></button>`).join('')}</div>`; },
  pad(P, gp, k){ const v = phV(); const i = this.cur(gp, v); if (i < 0 || PH.gs['s' + i] != null) return null; PH.gs['s' + i] = k; return {a: 'tap', i, c: k}; },
  bot(S, g, pid, v){ if (g.st !== 'q') return; const rel = v - g.t0; g.seq.forEach((it, i) => { if (i > g.done && rel > it.at + 500 && rel < it.at + it.win && (g.taps[pid] || {})[i] == null && Math.random() < .3){ if (it.s ? Math.random() < .85 : Math.random() < .2) this.act(S, g, pid, {a: 'tap', i, c: it.s && Math.random() < .9 ? it.c : rnd(4)}, v); } }); },
});

def('siguiente', {name: 'El Siguiente Número', cat: 'Caos', icon: '🔢', desc: 'Contad juntos hasta donde podáis. Si dos lo decís a la vez… vuelta a empezar.',
  rules: ['Hay que contar del 1 en adelante, EN VOZ ALTA y sin poneros de acuerdo.', 'Quien diga un número lo grita y pulsa su botón a la vez. Si dos lo decís a la vez, ¡choque! Y se vuelve al 1.', 'Cada número que digas sin chocar suma. Si llegáis a la meta, premio para todos.'], ri: ['🗣️', '💥', '🏁'], ctl: 'Gritar y pulsar',
  init(S){ return {n: 1, last: null, cred: {}, crash: {}, st: 'wait', goal: Math.max(8, pidsAll(S).length * 2), best: 0, boom: null, done: false}; },
  start(S, g, v){ g.st = 'q'; g.t0 = v; g.t1 = v + 50000; },
  step(S, g, v){ if (g.st === 'q' && (v >= g.t1 || g.done)){ g.st = 'rev'; g.t1 = v + 5500; return false; } return g.st === 'rev' && v >= g.t1; },
  act(S, g, pid, a, v){ if (a.a !== 'say' || g.st !== 'q') return false; const L = g.last;
    if (L && L.pid === pid) return false;
    if (L && v - L.t < 900){ g.cred[L.pid] = (g.cred[L.pid] || 1) - 1; g.crash[L.pid] = (g.crash[L.pid] || 0) + 1; g.crash[pid] = (g.crash[pid] || 0) + 1; g.boom = {a: L.pid, b: pid, at: v, n: g.n - 1}; g.n = 1; g.last = null; return true; }
    g.cred[pid] = (g.cred[pid] || 0) + 1; g.last = {pid, t: v}; g.best = Math.max(g.best, g.n); g.n++; if (g.n > g.goal) g.done = true; return true; },
  result(S, g){ const raw = {}; pidsAll(S).forEach(p => raw[p] = Math.max(0, (g.cred[p] || 0) * 80 - (g.crash[p] || 0) * 40 + (g.done ? 150 : 0))); return {raw}; },
  pub(S, g, v){ return {st: g.st, t0: g.t0, t1: g.t1, n: g.n, goal: g.goal, last: g.last ? g.last.pid : null, boom: g.boom && v - g.boom.at < 2200 ? g.boom : null, done: g.done, best: g.best}; },
  me(S, g, pid){ return {last: g.last && g.last.pid === pid}; },
  tv(P, gp){ if (gp.st === 'rev') return `<div class="gq"><h2 class="q">${gp.done ? '¡Lo habéis conseguido!' : `Habéis llegado hasta el ${gp.best}`}</h2><p class="note">La meta era ${gp.goal}.</p></div>`;
    if (gp.boom) return `<div class="gq"><div class="boom">¡CHOQUE!</div><div class="spot-row">${[gp.boom.a, gp.boom.b].map(p => `<div class="spot-p">${avH(pOf(P, p), 'lg')}<b>${esc(pOf(P, p).name)}</b></div>`).join('')}</div><p class="msg">Vuelta a empezar desde el 1</p></div>`;
    return `<div class="gq"><div class="tag">Meta: ${gp.goal}</div><div class="nextn">${gp.n - 1 || '·'}</div>${gp.last ? `<p class="msg">Lo ha dicho ${esc(pOf(P, gp.last).name)}</p>` : '<p class="msg">¿Quién empieza?</p>'}<p class="shout">🗣️ ¡Decid el ${gp.n} en voz alta… y pulsad!</p>${barH(gp.t0, gp.t1)}</div>`; },
  ph(P, gp, M){ if (gp.st === 'rev') return phVerdict(gp.done, gp.done ? '¡Meta conseguida!' : 'Llegasteis al ' + gp.best);
    if (gp.boom) return waitPh('💥 ¡Choque!', 'Vuelta al 1');

  bot(S, g, pid, v){ if (g.st === 'q' && Math.random() < .03) this.act(S, g, pid, {a: 'say'}, v); },
});
